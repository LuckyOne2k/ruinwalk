name: instance-tests
on:
  push:
    paths: ['server/instance/**', 'supabase/schema.sql', 'supabase/tests/**', 'supabase/dev/**', 'supabase/functions/**', '.github/workflows/instance-tests.yml', '.github/workflows/dev-test.yml']
  pull_request:
    paths: ['server/instance/**', 'supabase/schema.sql', 'supabase/tests/**', 'supabase/dev/**', 'supabase/functions/**']
jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Determinismus Node / Bun / Deno
        env:
          REQUIRE_RUNTIMES: node bun deno
        run: bash server/instance/tests/run-determinism.sh
      - name: Engine v1 (Node) - Referenzkämpfe, Kernregeln, Klassenstruktur und Wiederbelebung
        run: |
          node server/instance/tests/golden.mjs
          node server/instance/tests/combat.mjs
          node server/instance/tests/struktur.mjs
          node server/instance/tests/trennung.mjs
          node server/instance/tests/offen.mjs
  database:
    # Gleiche Tests auf PostgreSQL 16 und 17 (Dev-Projekt: 17.12). Je Version wird die Hauptversion ausdrücklich gewählt (PG_MAJOR), nie stillschweigend die andere genommen.
    # Enthält die kombinierte Installation (schema.sql + rwi 01-05), Rechte-Audit, RLS/Produktionstests, Integrationstest Konto-Charakter-Instanz,
    # Installations-/Rollback-/Zweitinstallationstest und den Worker-Kern. Alle Läufe sind lokale Simulationen der Supabase-Umgebung (siehe docs/SUPABASE_INTEGRATION_NACHTBERICHT.md).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17]
    env:
      PG_MAJOR: ${{ matrix.pg }}
      RESULTS: results/pg${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: PostgreSQL ${{ matrix.pg }} (PGDG) und Hilfsprogramme
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${{ matrix.pg }}" "postgresql-contrib-${{ matrix.pg }}" || sudo apt-get install -y "postgresql-${{ matrix.pg }}"
          sudo systemctl stop postgresql || true
          "/usr/lib/postgresql/${{ matrix.pg }}/bin/postgres" --version
      - name: Alle Datenbanktests (Protokoll je Test unter results/)
        run: bash server/instance/tests/run-all-db.sh
      - name: Erzeugte Installationsdatei (Prüfsumme für Reproduzierbarkeit)
        if: ${{ !cancelled() }}
        run: |
          bash supabase/dev/build.sh "$RESULTS/install_dev.sql" | tee -a "$RESULTS/summary.txt"
      - name: Ergebnisse sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-tests-pg${{ matrix.pg }}
          path: results/
          retention-days: 30
  vergleich-pg16-pg17:
    # Kontrolle,
    # dass beide PostgreSQL-Versionen je Test dieselbe Zahl bestandener Prüfungen und denselben Ausgang liefern (Referenzkämpfe und Dungeon-Läufe sind Teil davon).
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'db-tests-pg*', path: results }
      - name: Vergleich der Zusammenfassungen (ok-Zahlen je Test müssen gleich sein)
        run: |
          cat results/db-tests-pg16/pg16/summary.txt results/db-tests-pg17/pg17/summary.txt || true
          diff <(grep -E '^[a-z0-9-]+ +exit' results/db-tests-pg16/pg16/summary.txt | sed 's/ | .*//; s/ \+/ /g') <(grep -E '^[a-z0-9-]+ +exit' results/db-tests-pg17/pg17/summary.txt | sed 's/ | .*//; s/ \+/ /g')
  bestehende-tests:
    # Die schon vorhandenen Tests (Spiellogik und Supabase-Schema) laufen hier zusätzlich; pages.yml bleibt unberührt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl stop postgresql || true
      - name: Playwright mit Chromium (für die Browser-Tests der Spiellogik)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Node-Tests (npm test)
        run: npm test
      - name: Supabase-Schema-Tests
        if: ${{ !cancelled() }}
        run: bash supabase/tests/run.sh
