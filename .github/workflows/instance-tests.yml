name: instance-tests
on:
  push:
    paths: ['server/instance/**', 'supabase/schema.sql', 'supabase/migration_*.sql', 'supabase/rollback_*.sql', 'supabase/tests/**', 'supabase/dev/**', 'supabase/functions/**', 'supabase/config.toml', 'tests/**', 'index.html', 'sprites*.js', 'pxdom.js', 'package.json', '.github/workflows/instance-tests.yml',
            # Pages-Positivliste (Roadmap Phase 2A): Skript, Liste, Tests, Pages-Workflow und alle ausgelieferten Spielbereiche
            'tools/pages/**', 'tests/pages/**', '.github/workflows/pages.yml', '.github/workflows/spieltests.yml', 'landingpage.html', 'figs/**', 'items/**', 'status/**', 'assets/**']
  # Pull Requests: ohne Pfadfilter – jeder PR wird vollständig geprüft (Spielcode, Tests, Server), damit Pflicht-Prüfungen im Ruleset immer berichten.
  pull_request:
# Kleinste Rechte: nur Lesen des Repositorys.
permissions:
  contents: read
jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - name: Determinismus Node / Bun / Deno
        env:
          REQUIRE_RUNTIMES: node bun deno
        run: bash server/instance/tests/run-determinism.sh
      - name: Edge Function operator - Typprüfung unter Deno (deno check)
        run: deno check supabase/functions/operator/index.ts
      - name: Edge Function operator - Smoke-Test von index.ts unter Bun mit Deno-Attrappe (SIMULIERT, kein Deno-Lauf)
        run: bun server/instance/tests/operator-index.bun.mjs
      - name: Engine v1 (Node) - Referenzkämpfe, Kernregeln, Klassenstruktur und Wiederbelebung
        run: |
          node server/instance/tests/golden.mjs
          node server/instance/tests/combat.mjs
          node server/instance/tests/struktur.mjs
          node server/instance/tests/trennung.mjs
          node server/instance/tests/offen.mjs
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: PostgreSQL-Binaries und pgcrypto
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl stop postgresql || true
      - name: Phase-0-Tests (isoliertes temporäres Postgres, keine Spielerdaten)
        run: node server/instance/tests/run.mjs
      - name: Todesfenster, Wiederbelebung, Wipe-Halt, Gruppenpause, Eventende je Eingangsfunktion
        run: node server/instance/tests/fenster.mjs
      - name: Gruppenverwaltung und instance_view
        run: node server/instance/tests/gruppe.mjs
      - name: Eventende K.2 Regel 4a-4d (Watchdog, Sweeps, Endzustand, Anlage, Rennen)
        run: node server/instance/tests/eventende.mjs
      - name: Eventende-Semantik (completed_at < ends_at, Sichtbarkeit, konkurrierende Transaktionen)
        run: node server/instance/tests/semantik.mjs
      - name: Produktionssicherheit - Spieleridentität und Rechte mit echten Datenbankrollen (anon, authenticated, service_role; Modus neu und legacy)
        run: node server/instance/tests/produktion.mjs
      - name: Kombinierte Installation (schema.sql + rwi 01-05) - Dev-Nachbau, Installation/Rollback, Rechte-Audit
        run: |
          node server/instance/tests/dev-umgebung.mjs
          node server/instance/tests/installation.mjs
          node server/instance/tests/rechte-audit.mjs
      - name: Konto, Charakter, Löschvorgang, Sperrreihenfolge B-2/B-3, Quest-Sperren (Paket 2), Profilableitung (F5/F9), Platz 3
        run: |
          node server/instance/tests/konto-integration.mjs
          node server/instance/tests/konto-regel.mjs
          node server/instance/tests/loesch-trigger.mjs
          node server/instance/tests/b2-sperren.mjs
          node server/instance/tests/quest-sperren.mjs
          node server/instance/tests/profil-ableitung.mjs
          node server/instance/tests/slot3-f9.mjs
      - name: Worker-Kern, Schnittstelle A1, stuck und kontrollierte Wiederaufnahme
        run: |
          node server/instance/tests/worker.mjs
          node server/instance/tests/worker-a1.mjs
          node server/instance/tests/stuck.mjs
          node server/instance/tests/hotfix-resume.mjs
      - name: Betreiber (Operatoren, Edge Function operator, Grenzwerte, Parallelität)
        run: |
          node server/instance/tests/operatoren.mjs
          node server/instance/tests/operator-edge.mjs
          node server/instance/tests/operator-korrekturen.mjs
          node server/instance/tests/operatoren-limit.mjs
          node server/instance/tests/operatoren-parallel.mjs
      - name: S-A-Untersuchung (nur Analyse)
        run: node server/instance/tests/sa-untersuchung.mjs
      - name: K.2-Vergleich (neue Variante muss fehlerfrei sein)
        run: |
          node server/instance/tests/k2-compare.mjs skip 15
          node server/instance/tests/k2-compare.mjs skip 15 nosweep
      - name: Diagnoseausgabe bei Datenbankfehlern (Deadlock-Meldung mit SQLSTATE/DETAIL/CONTEXT, Serverlog)
        run: node server/instance/tests/diagnose-test.mjs
      - name: Dungeon-Kämpfe über die komplette Auftragskette
        run: |
          for s in 3 4 5; do node server/instance/sim/run-dungeon.mjs --seed $s --ruhig || exit 1; done
          node server/instance/sim/run-dungeon.mjs --seed 3 --weltboss-ende --ruhig
      - name: Reproduzierbarkeit (gleicher Seed = identisches Kampfprotokoll)
        run: |
          a=$(node server/instance/sim/run-dungeon.mjs --seed 3 | grep -v "Worker-Absturz" | md5sum)
          b=$(node server/instance/sim/run-dungeon.mjs --seed 3 | grep -v "Worker-Absturz" | md5sum)
          echo "$a / $b"; [ "$a" = "$b" ]
  database-pg17:
    # Zusätzlich (keine Pflichtprüfung): alle Datenbanktests auf PostgreSQL 17 wie auf Supabase (ruinwalk 17.11, ruinwalk-dev 17.12).
    # Die Hauptversion wird ausdrücklich gewählt (PG_MAJOR); ist sie nicht installiert, bricht der Lauf ab, statt eine andere zu nehmen.
    runs-on: ubuntu-latest
    env:
      PG_MAJOR: '17'
      RESULTS: results/pg17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: PostgreSQL 17 (PGDG)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 postgresql-contrib-17 || sudo apt-get install -y postgresql-17
          sudo systemctl stop postgresql || true
          /usr/lib/postgresql/17/bin/postgres --version
      - name: Alle Datenbanktests auf PostgreSQL 17 (Protokoll je Test unter results/)
        run: bash server/instance/tests/run-all-db.sh
      - name: Reproduzierbarkeit (gleicher Seed = identisches Kampfprotokoll)
        run: |
          a=$(node server/instance/sim/run-dungeon.mjs --seed 3 | grep -v "Worker-Absturz" | md5sum)
          b=$(node server/instance/sim/run-dungeon.mjs --seed 3 | grep -v "Worker-Absturz" | md5sum)
          echo "$a / $b"; [ "$a" = "$b" ]
      - name: Protokolle bei Fehlern ausgeben
        if: ${{ failure() }}
        run: for f in "$RESULTS"/*.log; do echo "===== $f"; tail -n 200 "$f"; done
      - name: Erzeugte Installationsdatei (Prüfsumme für Reproduzierbarkeit)
        if: ${{ !cancelled() }}
        run: bash supabase/dev/build.sh "$RESULTS/install_dev.sql" | tee -a "$RESULTS/summary.txt"
      - name: Ergebnisse sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-tests-pg17
          path: results/
          retention-days: 30
  spieltests:
    # Browser-Tests der Spiellogik und Pages-Positivliste – gemeinsamer Workflow, den auch pages.yml vor jedem Deployment nutzt.
    uses: ./.github/workflows/spieltests.yml
    permissions:
      contents: read
  pages-positivliste:
    # Pflichtprüfung im Ruleset (Name bleibt): grün nur, wenn die Positivliste im Baustein spieltests bestanden hat.
    needs: spieltests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Torprüfung: Die Browser-Tests laufen im Baustein spieltests. Dieser Job ist Pflichtprüfung im Ruleset und darf
      # nur grün werden, wenn spieltests erfolgreich war (ein übersprungener Job zählte sonst als bestanden).
      - name: Ergebnis der Spieltests (Baustein spieltests.yml)
        env:
          ERGEBNIS: ${{ needs.spieltests.result }}
        run: |
          echo "spieltests: $ERGEBNIS"
          [ "$ERGEBNIS" = "success" ]
  bestehende-tests:
    # Pflichtprüfung im Ruleset (Name bleibt): Spieltests (Baustein) müssen grün sein, danach die Supabase-Schema-Tests.
    needs: spieltests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Torprüfung: Die Browser-Tests laufen im Baustein spieltests. Dieser Job ist Pflichtprüfung im Ruleset und darf
      # nur grün werden, wenn spieltests erfolgreich war (ein übersprungener Job zählte sonst als bestanden).
      - name: Ergebnis der Spieltests (Baustein spieltests.yml)
        env:
          ERGEBNIS: ${{ needs.spieltests.result }}
        run: |
          echo "spieltests: $ERGEBNIS"
          [ "$ERGEBNIS" = "success" ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl stop postgresql || true
      - name: Supabase-Schema-Tests
        run: bash supabase/tests/run.sh
