name: Deploy Ruin Walk to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Keine globalen Rechte: jeder Job bekommt nur, was er braucht.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Erst die Spieltests (Browser-Tests + Positivliste). Schlagen sie fehl, wird nicht veröffentlicht –
  # auch nicht beim manuellen Start (workflow_dispatch), denn deploy hängt immer von diesem Job ab.
  spieltests:
    uses: ./.github/workflows/spieltests.yml
    permissions:
      contents: read
  deploy:
    needs: spieltests
    # Veröffentlicht wird nur von main – bei Push und bei manuellem Start. Auf anderen Zweigen laufen nur die Spieltests.
    # Ohne Statusfunktion im Ausdruck ergänzt GitHub success(): rote Spieltests verhindern das Deployment weiterhin.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # Positivliste (Roadmap Phase 2A): nur Dateien aus tools/pages/allowlist.txt werden veröffentlicht.
      # Schlägt ein Schritt fehl, bricht der Job ab – Hochladen und Veröffentlichen laufen dann nicht.
      - name: Positivliste testen
        run: node --test tests/pages/site.test.mjs
      - name: Veröffentlichungsverzeichnis bauen und prüfen
        run: node tools/pages/site.mjs bauen _site
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
