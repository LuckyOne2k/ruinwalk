<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fdf6ee">
<title>Ruin Walk – GPS-RPG</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fdf6ee;--ink:#4a3526;--acc:#f6a623;--hp:#e5534b;--en:#3b82f6;--ok:#3aa76d;--card:#fffaf4;--line:#e8d9c6;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:#ddd;overflow:hidden;touch-action:manipulation}
#map{position:absolute;inset:0;background:#efe6d8}
.leaflet-tile-pane{filter:sepia(.3) saturate(.85) brightness(1.04)}
button{font-family:inherit;color:inherit}
/* HUD */
#hud{position:absolute;left:10px;top:calc(10px + var(--st));z-index:500;display:flex;gap:8px;align-items:center;background:rgba(255,250,244,.94);border:1px solid var(--line);border-radius:30px;padding:6px 12px 6px 6px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#lv{width:38px;height:38px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:#fff}
.bars{display:flex;flex-direction:column;gap:4px;width:130px}
.bar{position:relative;height:15px;border-radius:8px;background:#e9dccb;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%}
.bar.hp i{background:linear-gradient(#ff7a6e,#e5534b)}
.bar.en i{background:linear-gradient(#6aa8ff,#3b82f6)}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:15px;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#gps{position:absolute;right:10px;top:calc(10px + var(--st));z-index:500;background:rgba(255,250,244,.94);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#cu{position:absolute;right:10px;top:calc(46px + var(--st));z-index:500;background:rgba(255,250,244,.94);border:1px solid var(--line);border-radius:16px;padding:3px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#gps.good{color:#1f7a49}#gps.ok{color:#9a6a00}#gps.bad{color:#b3322b}
#toast{position:absolute;left:50%;top:calc(66px + var(--st));transform:translateX(-50%) translateY(-10px);z-index:900;background:rgba(60,40,28,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loc{position:absolute;right:12px;bottom:calc(76px + var(--sb));z-index:500;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#loc.off{background:var(--acc);color:#fff}
#attr{position:absolute;left:8px;bottom:calc(68px + var(--sb));z-index:400;font-size:10px;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px}
/* Nav */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:600;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
#nav button{position:relative;flex:1;border:0;background:none;font-size:11px;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
#nav button b{font-size:22px;font-weight:normal}
/* Card */
#card{position:absolute;left:10px;right:10px;bottom:calc(70px + var(--sb));z-index:700;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none;max-width:480px;margin:0 auto}
.ch{display:flex;gap:10px;align-items:center}
.ci{width:48px;height:48px;border-radius:12px;background:#f3e8d9;display:flex;align-items:center;justify-content:center;font-size:28px}
.ch small{display:block;opacity:.7;margin-top:2px}
.ch>div:nth-child(2){flex:1}
.x{border:0;background:none;font-size:20px;padding:4px 8px}
.row{margin:8px 0 4px;font-size:13px;line-height:1.5}
.bad{color:#b3322b}.good{color:#1f7a49}
.act{width:100%;margin-top:8px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;padding:12px;font-weight:bold}
.act:disabled{background:#e4dacb;color:#8a7766}
.hpbar{height:10px;border-radius:6px;background:#e9dccb;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--hp)}
/* Sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;top:12%;z-index:800;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.35);display:none;flex-direction:column}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;background:linear-gradient(#ffe0b0,var(--card));border-radius:22px 22px 0 0}
.sh-head h2{margin:0;font-size:22px}
#shB{flex:1;overflow:auto;padding:6px 16px calc(24px + var(--sb))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button.it{font:inherit;color:inherit}
.it{background:#f6ecdd;border:1px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px;position:relative}
.it span{font-size:26px;display:block}.it b{position:absolute;right:6px;top:3px;font-size:13px}.it small{font-size:10px;display:block;line-height:1.1}
h3{margin:16px 0 6px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.rec{background:#f6ecdd;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.rec .t{font-weight:bold}.rec .c{font-size:13px;margin:4px 0}
.btn{border:0;border-radius:10px;background:var(--acc);color:#fff;padding:8px 14px;font-weight:bold;font-size:14px}
.btn:disabled{background:#e4dacb;color:#8a7766}
.btn.sec{background:#e9dccb;color:var(--ink)}
.q{background:#f6ecdd;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.q.done{opacity:.55}.q.act2{background:#ffe9c4;border-color:var(--acc)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.tabs{display:flex;gap:8px;margin:6px 0 12px}
.tab{flex:1;border:1px solid var(--line);background:#f6ecdd;border-radius:12px;padding:10px 4px;font-size:14px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold}
.badge{position:absolute;top:-2px;right:18%;min-width:18px;height:18px;padding:0 4px;background:#e5534b;color:#fff;border-radius:9px;font-size:11px;font-style:normal;font-weight:bold;display:none;align-items:center;justify-content:center}
.q .btn{width:100%;margin-top:8px;padding:11px;font-size:15px}
#skills.many .sk{width:46px;height:46px}
#skills{position:absolute;right:12px;bottom:calc(136px + var(--sb));z-index:500;display:none;flex-direction:column-reverse;gap:8px}
.sk{width:54px;height:54px;border-radius:50%;border:2px solid var(--acc);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.sk .si{font-size:22px}.sk .sc{font-size:10px;margin-top:3px;font-weight:bold}
.sk.off{opacity:.45;border-color:#b9a78f}
.skrow{display:flex;gap:12px;justify-content:center;margin-top:10px}
#exh{position:absolute;left:10px;top:calc(66px + var(--st));z-index:500;background:rgba(255,235,205,.96);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#faint{position:absolute;inset:0;z-index:1100;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:22px}
.fbox{background:var(--card);border-radius:20px;padding:20px;max-width:360px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.5);text-align:center}
.fbox h2{margin:0 0 6px;font-size:24px}.fbox p{margin:8px 0;font-size:14px;line-height:1.45}
.fbox ul{text-align:left;margin:8px 0 12px;padding-left:20px;font-size:14px;line-height:1.5}
/* Schwebende Zahlen */
.fl{font-weight:800;font-size:20px;white-space:nowrap;text-align:center;pointer-events:none;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 2px #000;animation:flup 1.3s ease-out forwards}
.fl.dmg{color:#ff3b3b}.fl.heal{color:#3ddc6a}.fl.crit{font-size:28px}
@keyframes flup{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-8px) scale(1.15);opacity:1}100%{transform:translateY(-52px) scale(1);opacity:0}}
/* Entities */
.leaflet-map-pane:not(.leaflet-zoom-anim) .leaflet-marker-icon.roam{transition:transform 1s linear}
.ent.t-rare{border-color:#9b5de5;background:#f1e6ff}
.ent.t-elite{border-color:#f5a623;border-width:3px;background:#fff0d2;box-shadow:0 0 10px 3px rgba(245,166,35,.65);font-size:26px}
.ent.t-boss{border-color:#c1121f;border-width:3px;background:#ffe0e0;box-shadow:0 0 14px 4px rgba(193,18,31,.55);font-size:32px}
.ent.t-area{border-color:#6a040f;border-width:4px;background:#ffd6d6;box-shadow:0 0 20px 7px rgba(106,4,15,.6);font-size:40px}
.ent.t-area::after{content:'👑';position:absolute;top:-18px;font-size:22px}
.ent{width:44px;height:44px;border-radius:50%;background:rgba(255,250,244,.96);border:2px solid #d9c3a5;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;transition:.15s}
.ent.near{border-color:var(--ok);box-shadow:0 0 0 4px rgba(58,167,109,.35),0 2px 6px rgba(0,0,0,.3)}
.ent.sel{transform:scale(1.18)}
.ent.alert::before{content:'❗';position:absolute;top:-16px;font-size:18px}
.ent.mob{border-color:#e5534b;background:#fde8e5}
.ent.shop{border-color:#c1892f;background:#fff1c9;font-size:26px}
#exh{cursor:pointer}
.ent.mob.near{box-shadow:0 0 0 4px rgba(229,83,75,.35)}
.mhp{position:absolute;left:4px;right:4px;bottom:-9px;height:5px;background:#5a2a27;border-radius:3px;overflow:hidden}
.mhp u{display:block;height:100%;background:#ff6b5e;width:100%}
.mech{width:52px;height:52px;font-size:50px;line-height:52px;text-align:center;position:relative}.mech::before{content:'';position:absolute;left:10px;right:10px;bottom:2px;height:8px;border-radius:50%;background:rgba(0,0,0,.28)}.mech .px{position:relative}.mech.mflip .px{transform:scaleX(-1)}
/* Start */
#start{position:absolute;inset:0;z-index:1000;background:linear-gradient(#ffe7c2,#fdf6ee);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:12px}
#start h1{margin:0;font-size:36px}
#start p{margin:0;max-width:340px;line-height:1.45}
#start .btn{font-size:17px;padding:14px 22px;width:100%;max-width:340px}
#start .warn{color:#b3322b;font-size:13px}
</style>
</head>
<body>
<div id="map"></div>

<div id="hud">
  <div id="lv">1</div>
  <div class="bars">
    <div class="bar hp"><i id="hpb"></i><span id="hpt"></span></div>
    <div class="bar en"><i id="enb"></i><span id="en2"></span></div>
  </div>
</div>
<div id="gps" class="bad">GPS: aus</div>
<div id="cu"></div>
<div id="toast"></div>
<button id="loc" data-a="loc" aria-label="Zentrieren">◎</button>
<div id="attr">© OpenStreetMap-Mitwirkende</div>
<div id="exh" data-a="skipexh"></div>
<div id="skills"></div>
<div id="card"></div>

</div>

<div id="faint"><div class="fbox" id="fbox"></div></div>

<div id="start">

  return {n:SHOP_NAMES[Math.floor(r()*SHOP_NAMES.length)],items,gear};

const upProg=()=>{const c=cnt(),b=S.qb||c,q=UPQ[S.tier];return q.g.map(([l,f,n])=>[l,Math.min(n,Math.max(0,f(c)-f(b))),n]);};
const upQuestDone=()=>S.tier<3&&upProg().every(g=>g[1]>=g[2]);

  &&(S.tier<2||!S.path||SECRET[S.path].ok());
/* Wirksame Klasse = Grundklasse + Stufe des Pfads */
const _eff={};
function effClass(){
  const base=CLASSES[S.cls]||CLASSES.wanderer;
  if(!S.path||!S.tier||!PATHS[S.path])return base;
  const key=S.cls+'|'+S.path+'|'+S.tier;if(_eff[key])return _eff[key];
  const P2=PATHS[S.path],st=P2.st[S.tier-1],m=st.m,o=Object.assign({},base);
  o.n=st.n;o.i=st.i;o.blurb=P2.t+'. '+(m.dm?'Schaden ×'+m.dm+'. ':'')+(m.hits?m.hits+' Treffer pro Angriff. ':'')+'Verbesserte Werte und neue Fähigkeit.';
  o.dmg=base.dmg*(m.dm||1);o.crit=Math.min(.95,base.crit+(m.crit||0));
  if(m.range)o.range=m.range;if(m.hpb!==undefined)o.hpb=m.hpb;if(m.def!==undefined)o.def=m.def;
  o.heal=(base.heal||0)+(m.heal||0);if(m.hits)o.hits=m.hits;o.enreg=(base.enreg||1)*(m.enreg||1);
  o.sk=(base.sk||[]).slice();
  for(let t=0;t<S.tier;t++){const k=P2.st[t].sk;o.sk.push(Object.assign({lv:UP_LV[t]},k));}
  return _eff[key]=o;
}

function dist(a,b){
  const R=6371000,r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

const HPRI={g:1,r:2,w:3,f:4,s:5};
function habClass(t){
  if(!t)return null;
  const L=t.landuse,N=t.natural,W=t.waterway,Le=t.leisure;
  if(N==='water'||N==='wetland'||N==='bay'||L==='basin'||L==='reservoir'||W==='riverbank')return 's';
  if(N==='bare_rock'||N==='scree'||N==='rock'||N==='cliff'||N==='stone'||L==='quarry')return 'f';
  if(N==='wood'||N==='scrub'||L==='forest')return 'w';
  if(L==='residential'||L==='commercial'||L==='industrial'||L==='retail'||L==='railway'||L==='construction'||L==='brownfield'||L==='garages'||L==='military'||L==='cemetery')return 'r';
  if(L==='meadow'||L==='grass'||L==='farmland'||L==='farmyard'||L==='orchard'||L==='vineyard'||L==='allotments'||L==='village_green'||L==='recreation_ground'||N==='grassland'||N==='heath'||Le==='park'||Le==='garden'||Le==='pitch'||Le==='nature_reserve')return 'g';

function pip(lat,lon,ring){let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a.lat>lat)!==(b.lat>lat)&&lon<(b.lon-a.lon)*(lat-a.lat)/(b.lat-a.lat)+a.lon)ins=!ins;}return ins;}

  const mark=(i,c)=>{if(HPRI[c]>best[i])best[i]=HPRI[c];};
  const cell=(lat,lon)=>{const x=Math.floor(lon/DLON)-cx0,y=Math.floor(lat/DLAT)-cy0;return x>=0&&y>=0&&x<CH&&y<CH?y*CH+x:-1;};

    let a=1e9,b=-1e9,l=1e9,r=-1e9;
    for(const p of ring){if(p.lat<a)a=p.lat;if(p.lat>b)b=p.lat;if(p.lon<l)l=p.lon;if(p.lon>r)r=p.lon;}
    const x0=Math.max(0,Math.floor(l/DLON)-cx0),x1=Math.min(CH-1,Math.floor(r/DLON)-cx0),y0=Math.max(0,Math.floor(a/DLAT)-cy0),y1=Math.min(CH-1,Math.floor(b/DLAT)-cy0);

      for(let s=0;s<=n;s++){const i=cell(p.lat+(q.lat-p.lat)*s/n,p.lon+(q.lon-p.lon)*s/n);if(i>=0)mark(i,c);}
    }
  };
  const closed=g=>g&&g.length>=4&&g[0].lat===g[g.length-1].lat&&g[0].lon===g[g.length-1].lon;
  for(const el of els){
    if(!el.tags&&el.center){const i=cell(el.center.lat,el.center.lon);if(i>=0)bld[i]++;continue;}

function monsterHit(m,e){
  if(S.stun>0){S.stun--;toast('😵 '+m.n+' ist gelähmt');return;}
  const r=roam.get(e.id)||{},hpNow=S.mh[e.id]??m.hp;
  r.n=(r.n||0)+1;
  if(m.ab==='heil'&&hpNow<m.hp*.6&&r.n%3===0){
    S.mh[e.id]=Math.min(m.hp,Math.round(hpNow+m.hp*.08));
    fMob(e,'+'+Math.round(m.hp*.08),'heal',0);toast(m.i+' '+m.n+' heilt sich');refreshWorld();return;
  }
  if(Math.random()<.15+(SB().miss||0)){toast(m.i+' '+m.n+' verfehlt dich');return;}
  const raw=rnd(m.min,m.max);let h=Math.max(1,Math.ceil(raw*.25),raw-defense());   // Rüstung senkt höchstens 75 %
  if(m.tier==='area'&&hpNow<m.hp*.35)h=Math.round(h*1.4);   // Gebietsboss: Raserei
  if(m.ab==='wut'&&hpNow<m.hp*.3)h=Math.round(h*1.5);
  if(m.ab==='schwarm')h=Math.max(1,Math.round(h*.6));
  if(S.shield>0){S.shield--;h=Math.max(1,Math.round(h*.3));}
  {const sh=SB().steinhaut;if(sh&&++hitTaken%sh===0)h=1;}
  if(m.ab==='schwarm')h*=2;
  eng.set(e.id,Date.now());
  S.hp-=h;fMe('-'+h,'dmg',0);
  if(S.hp<=0){faint(m,e);hud();return;}
  let extra='';
  {const rs=SB().rescue;if(rs&&!rescueUsed&&S.hp<maxHP()*.3){rescueUsed=true;const g0=Math.round(maxHP()*rs);S.hp=Math.min(maxHP(),S.hp+g0);fMe('+'+g0,'heal',0);extra=' · 🌿 Hainsegen +'+g0;}}
  if(m.ab==='gift'&&Math.random()<.4){psn={dps:Math.max(1,Math.round(m.max*.1*(1-(SB().poisonRes||0)))),t:8};extra=' · ☠️ vergiftet';}
  else if(m.ab==='bruell'&&r.n%4===0&&Date.now()>=myStun){myStun=Date.now()+2500;extra=' · 😵 betäubt';}
  else if(m.ab==='saug'){const g=Math.round(h*.5);S.mh[e.id]=Math.min(m.hp,hpNow+g);extra=' · 🩸 saugt '+g;refreshWorld();}
  else if(m.ab==='dieb'&&S.cu>0&&Math.random()<.35){
    const st=Math.min(S.cu,Math.max(2,Math.round(S.cu*.06)));S.cu-=st;
    toast(m.i+' '+m.n+' stiehlt dir '+fmtM(st)+' und flieht!');
    S.cd[e.id]=Date.now();delete S.mh[e.id];eng.delete(e.id);if(sel&&sel.id===e.id)deselect();refreshWorld();hud();return;
  }
  toast(m.i+' '+m.n+' trifft dich: -'+h+extra);
  hud();
}
function refreshWorld(){
  if(!P)return;
  ensureHab();
  const cx=Math.floor(P.lon/DLON),cy=Math.floor(P.lat/DLAT),want=new Map();
  for(let dx=-VIEW;dx<=VIEW;dx++)for(let dy=-VIEW;dy<=VIEW;dy++)
    for(const e of cellEnts(cx+dx,cy+dy))if(alive(e)&&dist(P,e)<=SHOW_DIST)want.set(e.id,e);
  for(const e of areaEnts())if(alive(e)&&dist(P,e)<=AREA_DIST)want.set(e.id,e);
  for(const [id,o] of ents){const w=want.get(id),chg=w&&w.type!==o.e.type&&!eng.has(id);if(!w||chg){map.removeLayer(o.m);ents.delete(id);roam.delete(id);eng.delete(id);if(chg)delete S.mh[id];if(sel&&sel.id===id)deselect();}}
  for(const [id,e] of want){if(!ents.has(id)){if(canRoam(e)&&!roam.has(id))roam.set(id,{lat:e.lat,lon:e.lon,tlat:null,tlon:null,wait:rnd(0,15)});ents.set(id,{e,m:mk(e)});}}
  for(const [id,o] of ents){
    if(o.e.kind==='mob'){
      const el=o.m.getElement();if(!el)continue;
      const u=el.querySelector('.mhp u'),mx=MOBS[o.e.type].hp;
      if(u)u.style.width=(100*(S.mh[id]??mx)/mx)+'%';
    }
  }
  updateNear();
}
function updateNear(){
  if(!P)return;
  for(const [id,o] of ents){
    const el=o.m.getElement();if(!el||!el.firstElementChild)continue;
    const n=el.firstElementChild,r=o.e.kind==='mob'?atkRange():RANGE;
    n.classList.toggle('near',dist(P,ep(o.e))<=r);
    n.classList.toggle('sel',!!sel&&sel.id===id);
    n.classList.toggle('alert',o.e.kind==='mob'&&eng.has(id));
  }
}
function select(id){const o=ents.get(id);if(!o)return;sel=o.e;renderCard();updateNear();}
function deselect(){sel=null;$('#card').style.display='none';updateNear();updateSkillUI();}

/* ---------- Karte unten (Details) ---------- */
function renderCard(){
  const c=$('#card');
  if(!sel){c.style.display='none';updateSkillUI();return;}
  const e=sel,d=def2(e),isMob=e.kind==='mob',isShop=e.kind==='shop';
  let sub,body='',label,dis=true,action='';
  const dn=isShop?shopInfo(e).n:d.n;
  if(!P){sub='Warte auf Position…';label='Kein GPS';}
  else{
    const ds=dist(P,ep(e));
    sub=(isMob?TIERS[d.tier].l:isShop?'Händler':'Ressource')+' · '+fmtDist(ds)+' entfernt';
    if(isShop){
      body='<div class="row">Kauft Material, Ausrüstung und Runen. Verkauft Tränke, einfaches Material und Anfängerausrüstung. Repariert Werkzeug.</div>';
      action='shop';label='🏪 Handeln';
      if(ds>RANGE)label='Zu weit – noch '+Math.ceil(ds-RANGE)+' m';else dis=false;
    }else if(isMob){
      const mx=d.hp,hp=S.mh[e.id]??mx;
      body='<div class="row">❤️ '+hp+' / '+mx+'<div class="hpbar"><i style="width:'+(100*hp/mx)+'%"></i></div>'+C0().w+' · Reichweite '+atkRange()+' m · Energie '+C0().en
        +'<br>Empfohlen: Stufe '+d.rec+(S.lv+2<d.rec?' <span class="bad">⚠️ sehr gefährlich</span>':'')
        +'<br>Verhalten: '+(d.tier==='area'?'<b>Gebietsboss</b> · greift erst an, wenn du ihn angreifst':d.ag?'<b class="bad">😡 Aggressiv</b>':'🕊️ Friedlich, wehrt sich nur')
        +'<br>'+HAB[d.hab==='*'?'w':d.hab[0]].i+' Lebensraum: '+(d.hab==='*'?'überall':[...d.hab].map(h=>HAB[h].n).join(', '))
        +(d.ab?'<br>'+ABIL[d.ab][0]+' <b>'+ABIL[d.ab][1]+'</b>: '+ABIL[d.ab][2]:'')
        +'<br>Beute: '+d.drops.map(x=>ITEMS[x.i].i+(x.c?'?':'')).join(' ')+'</div>'+skRow();
      action='shoot';label=C0().i+' '+C0().act;
      if(ds>atkRange())label='Zu weit – noch '+fmtDist(ds-atkRange());
      else if(Date.now()<S.exh)label='😵 Erschöpft – noch '+fmtT(S.exh-Date.now());
      else if(Date.now()<nextAtk)label='⏳ '+((nextAtk-Date.now())/1000).toFixed(1).replace('.',',')+' s';
      else if(S.en<C0().en)label='Zu erschöpft';
      else dis=false;
    }else{
      action='collect';label='Einsammeln';
      let tl='';
      const tool=d.tool?findTool(d.tool):null;
      if(d.tool)tl=tool?ITEMS[tool.id].i+' '+ITEMS[tool.id].n+' · Haltbarkeit '+tool.dur:'<span class="bad">Benötigt: '+TOOLNAME[d.tool]+'</span>';
      body='<div class="row">'+(tl?tl+'<br>':'')+'Energie: '+d.en+' · Ertrag: '+ITEMS[d.drop].i+' '+d.min+'–'+d.max+'</div>';
      if(ds>RANGE)label='Zu weit – noch '+Math.ceil(ds-RANGE)+' m';
      else if(d.tool&&!tool)label='Werkzeug fehlt';
      else if(S.en<d.en)label='Zu erschöpft';
      else dis=false;
    }
  }
  const subH='<small id="cSub">'+sub+'</small>',btnTail='>'+label+'</button>';
  const html='<div class="ch"><div class="ci">'+d.i+'</div><div><b>'+dn+'</b>'+subH+'</div><button class="x" data-a="close">✕</button></div>'
    +body+'<button id="cAct" class="act" data-a="'+(action||'close')+'" '+(dis?'disabled':'')+btnTail;
  const key=html.replace(subH,'').replace(btnTail,'></button>');
  if(c._k!==key){c.innerHTML=html;c._k=key;}
  else{const a=$('#cSub'),b=$('#cAct');if(a)a.textContent=sub;if(b)b.textContent=label;}
  c.style.display='block';updateSkillUI();
}

/* ---------- Aktionen ---------- */
function collect(){
  const e=sel;if(!e||e.kind!=='node'||!P)return;
  const t=NODES[e.type];
  if(dist(P,ep(e))>RANGE){toast('Zu weit weg');return;}
  let tool=null;
  if(t.tool){tool=findTool(t.tool);if(!tool){toast('Dir fehlt das Werkzeug');return;}}
  if(S.en<t.en){toast('Zu erschöpft');return;}
  S.en-=t.en;
  let broke='';
  if(tool){tool.dur--;if(tool.dur<=0){S.tools=S.tools.filter(x=>x!==tool);broke=' · '+ITEMS[tool.id].n+' zerbrochen!';}}
  let q=rnd(t.min,t.max);
  if(t.skill&&Math.random()<Math.min(.5,(sl(t.skill)-1)*.1))q++;
  add(t.drop,q);
  S.stats.col[t.drop]=(S.stats.col[t.drop]||0)+q;
  S.stats.nodes[e.type]=(S.stats.nodes[e.type]||0)+1;
  if(t.skill)S.skills[t.skill]+=t.xp;
  S.cd[e.id]=Date.now();
  addXP(t.xp);
  toast('+'+q+' '+ITEMS[t.drop].n+broke);
  deselect();refreshWorld();checkQuests();save();hud();
}
function strike(o){
  const e=sel;if(!e||e.kind!=='mob'||!P)return false;
  const m=MOBS[e.type],C=C0();
  if(Date.now()<S.exh){toast('😵 Du bist noch erschöpft ('+fmtT(S.exh-Date.now())+')');return false;}
  if(Date.now()<myStun){toast('😵 Du bist benommen ('+Math.ceil((myStun-Date.now())/1000)+' s)');return false;}
  const dd=dist(P,ep(e));
  if(dd>(atkRange()+(o.rangeBonus||0))){toast('Zu weit weg');return false;}
  const first=!eng.has(e.id),sb=SB();
  eng.set(e.id,Date.now());
  if(S.en<o.en){toast('Zu erschöpft');return false;}
  S.en-=o.en;
  let dmg=0,crit=false;
  const fm=1+(sb.dm||0)+(m.ab==='panzer'?sb.dmgPanzer||0:0)+((m.tier==='boss'||m.tier==='area')?sb.dmgBoss||0:0)+(dd>50?sb.dmgFar||0:0)+(first?sb.first||0:0)+(o.icon?sb.skillDm||0:0);
  for(let i=0;i<(o.hits||1);i++){
    let d=Math.max(1,Math.round((atk()+rnd(0,8))*o.mult*fm));
    if(o.crit||Math.random()<critCh()){d=Math.round(d*(2+(sb.critDmg||0)));crit=true;}
    dmg+=d;
  }
  if(m.ab==='panzer')dmg=Math.max(1,Math.round(dmg*.65));
  let sx='';
  if(sb.dbl&&++atkCnt%sb.dbl===0){dmg*=2;sx+=' · 🔮 Doppelklang';}
  if(sb.poisonShot&&++psCnt%sb.poisonShot===0){dmg=Math.round(dmg*1.4);sx+=' · ☠️ Gift';}
  if(sb.burn&&crit){dmg=Math.round(dmg*1.3);sx+=' · 🔥 Glut';}
  let heal='';
  let hv=(o.heal||0)+(sb.healHit||0)+(o.healPct?maxHP()*o.healPct:0);
  hv=hv*(1+(sb.healMul||0))+dmg*(sb.lifesteal||0)+(crit?maxHP()*(sb.critHeal||0):0);
  if(hv){const b0=S.hp;S.hp=Math.min(maxHP(),S.hp+hv);if(S.hp>b0){heal=' · +'+Math.round(S.hp-b0)+' ❤️';fMe('+'+Math.round(S.hp-b0),'heal',0);}}
  if(o.shield)S.shield=o.shield;
  if(o.stun)S.stun=o.stun;
  fMob(e,'-'+dmg,'dmg'+(crit?' crit':''),0);
  if(m.ab==='dorn'){const rf=Math.max(1,Math.round(dmg*.12));S.hp=Math.max(1,S.hp-rf);fMe('-'+rf,'dmg',0);}
  const hp=(S.mh[e.id]??m.hp)-dmg;
  if(hp<=0){
    delete S.mh[e.id];S.cd[e.id]=Date.now();S.stats.kills++;S.stats.kt[m.tier]=(S.stats.kt[m.tier]||0)+1;{const hr=new Date().getHours();if(hr>=22||hr<4)S.stats.night++;}S.stun=0;
    const got=[];
    for(const dr of m.drops){if(Math.random()<(dr.c??1)){const q=rnd(dr.min,dr.max);add(dr.i,q);S.stats.col[dr.i]=(S.stats.col[dr.i]||0)+q;got.push('+'+q+' '+ITEMS[dr.i].n);}}
    {const cr=COIN[m.tier]||[1,3],cc=rnd(cr[0],cr[1]);earn(cc);got.push(fmtM(cc));}
    if(Math.random()<(RDROPCH[m.tier]||0)){const rq=rollQ(RDROPQ[m.tier]);add('rune'+rq,1);got.push('📜 '+ITEMS['rune'+rq].n);}
    const gd=rollGear(m.tier);if(gd)got.push('🎁 '+gNameT(gd.g)+(gd.auto?' (angelegt)':''));
    const sd=rollSet(e,m);if(sd)got.push('✨ '+gNameT(sd.g)+(sd.auto?' (angelegt)':''));
    addXP(m.xp);
    toast('💥 '+m.n+' besiegt! '+got.join(', '));
    deselect();refreshWorld();checkQuests();
  }else{
    S.mh[e.id]=hp;
    let msg=(crit?'💥 Kritisch! ':(o.icon||C.i)+' ')+dmg+' Schaden'+sx+heal;
    if(S.stun>0)msg+=' · '+m.n+' ist gelähmt';
    toast(msg);
    refreshWorld();
  }
  save();hud();renderCard();
  return true;
}
function fnum(ll,txt,cls,delay){
  setTimeout(()=>{
    if(!ll)return;
    const j=Math.round((Math.random()-.5)*28);
    const mk=L.marker([ll.lat,ll.lng],{icon:L.divIcon({className:'',html:'<div class="fl '+cls+'" style="margin-left:'+j+'px">'+txt+'</div>',iconSize:[80,30],iconAnchor:[40,34]}),zIndexOffset:3000,interactive:false}).addTo(map);
    setTimeout(()=>map.removeLayer(mk),1400);
  },delay||0);
}
function fMob(e,txt,cls,d){const p=ep(e);fnum({lat:p.lat,lng:p.lon!==undefined?p.lon:p.lng},txt,cls,d);}
function fMe(txt,cls,d){if(pm)fnum(pm.getLatLng(),txt,cls,d);}
function othersInFight(e){return 0;}
function faint(m,e){
  S.stats.faints=(S.stats.faints||0)+1;
  S.hp=Math.round(maxHP()*.3);S.shield=0;S.stun=0;eng.delete(e.id);
  /* Monster erholt sich nur, wenn kein anderer Spieler im Kampf ist; sonst behält es Leben und kämpft weiter (Mehrspieler: Server liefert die Zahl) */
  if(othersInFight(e)===0){delete S.mh[e.id];}
  const lines=[];
  if(S.cls==='wanderer'&&S.lv<CLASS_LV){
    lines.push('Anfängerschutz: Als Wanderer bleibst du ohne Strafe.');
  }else{
    const hard=m.tier==='elite'||m.tier==='boss'||m.tier==='area';
    const need=S.lv*40,lost=Math.min(S.xp,Math.round(need*(hard?.10:.05)));
    S.xp-=lost;lines.push('−'+lost+' Erfahrung');
    if(hard){
      let n=0;for(const t of S.tools){const nd=Math.max(1,Math.floor(t.dur*.8));if(nd<t.dur){t.dur=nd;n++;}}
      if(n)lines.push('Werkzeug −20 % Haltbarkeit');
    }
    S.exh=Date.now()+EXH_MS;lines.push('Erschöpft für '+fmtT(EXH_MS)+' (kein Kampf, Laufen und Sammeln gehen)');
  }
  deselect();
  $('#fbox').innerHTML='<h2>💫 Ohnmächtig!</h2><p>'+m.n+' hat dich besiegt. Das Spiel hat dich an dieser Stelle wiederbelebt. Du hast '+S.hp+' Leben.</p><ul>'+lines.map(x=>'<li>'+x+'</li>').join('')+'</ul><button class="btn" style="width:100%;padding:13px;font-size:16px" data-a="faintok">Weiter</button>';
  $('#faint').style.display='flex';
}
function exhUI(){
  const r=S.exh-Date.now(),el=$('#exh');
  if(r>0){el.textContent='😵 Erschöpft '+fmtT(r)+' · tippen: beenden';el.style.display='block';}else el.style.display='none';
}
let nextAtk=0;
function shoot(){
  const C=C0();
  if(Date.now()<nextAtk)return;
  if(strike({mult:C.dmg,hits:C.hits,en:C.en,heal:C.heal}))nextAtk=Date.now()+(C.cd||1.5)*1000;
}
function useSkill(i){
  const C=C0(),sk=(C.sk||[])[i];if(!sk)return;
  if(S.lv<sk.lv){toast('Diese Fähigkeit gibt es ab Stufe '+sk.lv);return;}
  const now=Date.now(),rd=S.scd[sk.id]||0;
  if(now<rd){toast('Noch '+Math.ceil((rd-now)/1000)+' s Abklingzeit');return;}
  if(S.en<enc(sk.en)){toast('Zu erschöpft');return;}
  if(sk.mult){
    if(!strike({mult:sk.mult,hits:sk.hits,crit:sk.crit,en:enc(sk.en),rangeBonus:sk.rangeBonus,heal:sk.heal,healPct:sk.healPct,stun:sk.stun,shield:sk.shield,icon:sk.i}))return;
    nextAtk=Math.max(nextAtk,Date.now()+800);
  }else{
    S.en-=enc(sk.en);
    const hm=1+(SB().healMul||0);
    if(sk.heal){const b0=S.hp;S.hp=Math.min(maxHP(),S.hp+(sk.heal+(sk.perLv||0)*S.lv)*hm);toast(sk.i+' '+sk.n+': +'+Math.round(S.hp-b0)+' Leben');fMe('+'+Math.round(S.hp-b0),'heal',0);}
    if(sk.healPct){const b0=S.hp;S.hp=Math.min(maxHP(),S.hp+maxHP()*sk.healPct*hm);toast(sk.i+' '+sk.n+': +'+Math.round(S.hp-b0)+' Leben');fMe('+'+Math.round(S.hp-b0),'heal',0);}
    if(sk.shield){S.shield=sk.shield;toast(sk.i+' '+sk.n+': Schutz für '+sk.shield+' Treffer');}
  }
  S.scd[sk.id]=now+sk.cd*1000;
  save();hud();updateSkillUI();
}
function skBtn(i){return '<button class="sk" data-a="skill" data-i="'+i+'" data-sk="'+i+'"><span class="si">'+C0().sk[i].i+'</span><small class="sc"></small></button>';}
function skRow(){const C=C0();return (C.sk&&C.sk.length)?'<div class="skrow">'+C.sk.map((x,i)=>skBtn(i)).join('')+'</div>':'';}
function buildSkillBar(){const C=C0();$('#skills').classList.toggle('many',(C.sk||[]).length>4);$('#skills').innerHTML=(C.sk||[]).map((x,i)=>skBtn(i)).join('');updateSkillUI();}
function updateSkillUI(){
  const C=C0(),sk=C.sk||[],now=Date.now();
  const cardShown=$('#card').style.display==='block';
  $('#skills').style.display=(sk.length&&!cardShown)?'flex':'none';
  const list=document.querySelectorAll?document.querySelectorAll('[data-sk]'):[];
  for(const el of list){
    const x=sk[+el.dataset.sk];if(!x)continue;
    const cd=Math.ceil(((S.scd[x.id]||0)-now)/1000);
    let txt,off=false;
    if(S.lv<x.lv){txt='Lv'+x.lv;off=true;}
    else if(cd>0){txt=cd+' s';off=true;}
    else if(x.mult&&S.exh>now){txt='😵';off=true;}
    else{txt=enc(x.en)+'⚡';off=S.en<enc(x.en);}
    const sc=el.querySelector('.sc');if(sc)sc.textContent=txt;
    el.classList.toggle('off',off);
  }
}
function craft(id){
  const r=RECIPES.find(x=>x.id===id);if(!r)return;
  for(const k in r.cost)if(have(k)<r.cost[k]){toast('Material fehlt');return;}
  for(const k in r.cost)S.inv[k]-=r.cost[k];
  if(r.kind==='tool')S.tools.push({id:r.id,type:r.type,dur:r.dur});
  else if(r.kind==='item')add(r.id,1);
  S.stats.crafted[id]=(S.stats.crafted[id]||0)+1;
  toast('🔨 '+ITEMS[id].n+' hergestellt');
  checkQuests();save();openSheet('craft');
}
function useItem(id){
  if(id==='trank'&&have('trank')>0){
    if(S.hp>=maxHP()){toast('Leben ist schon voll');return;}
    S.inv.trank--;S.hp=Math.min(maxHP(),S.hp+40);toast('🧪 +40 Leben');fMe('+40','heal',0);hud();save();openSheet('inv');
  }
}

];
function checkQuests(){
  for(const q of QUESTS){
    if(S.qdone.includes(q.id)||S.qready.includes(q.id))continue;
    if(q.goals().every(g=>g[1]>=g[2])){
      S.qready.push(q.id);
      toast('📜 Quest geschafft: '+q.t+' – Belohnung im Quest-Fenster abholen!');
    }else break; // spätere Quests bleiben gesperrt
  }
}
function claimQuest(id){
  const q=QUESTS.find(x=>x.id===id);
  if(!q||!S.qready.includes(id))return;
  S.qready=S.qready.filter(x=>x!==id);
  S.qdone.push(id);
  q.reward();
  toast('🎁 Belohnung erhalten: '+q.rt);
  checkQuests();save();hud();openSheet('quests');
}

      +'<h3>Ausrüstung</h3><div class="grid" style="grid-template-columns:repeat(5,1fr)">'
      +SLOTS.map(([k,l])=>{const g=gearOf(S.eq[k]);return '<button class="it" data-a="gearopen" data-slot="'+k+'" style="'+(g?'border:2px solid '+QC[g.q]:'opacity:.55')+'"><span>'+(g?getBase(g.b).i:SLOTIC[k])+'</span><small>'+l+'</small><small>'+(g?getBase(g.b).n+(g.p?' +'+g.p:''):'leer')+'</small></button>';}).join('')+'</div>'
      +'<button class="btn" data-a="gearopen" data-slot="waffe" style="margin-top:8px;width:100%">🎒 Ausrüstung verwalten ('+S.gear.length+')</button>'
      +'<h3>Lebensfertigkeiten</h3>'
      +Object.keys(SKILLNAME).map(k=>'<div class="kv"><span>'+SKILLNAME[k]+'</span><b>Stufe '+sl(k)+' <small>('+(S.skills[k]%10)+'/10)</small></b></div>').join('')
      +'';
    const C=C0();
    h+='<h3>Klasse</h3><div class="kv"><span>'+C.i+' '+C.n+'</span><small>'+C.w+' · '+C.range+' m</small></div>';
    if(S.cls==='wanderer'){
      h+=S.lv>=CLASS_LV
        ?'<button class="btn" data-a="open" data-s="class" style="margin-top:10px;width:100%;padding:13px;font-size:16px">🌟 Klasse wählen</button>'
        :'<p style="font-size:13px">Ab Stufe '+CLASS_LV+' kannst du eine Klasse wählen (noch '+(CLASS_LV-S.lv)+' Stufen).</p>';
    }else{h+='<p style="font-size:13px">'+C.blurb+'</p>'
      +'<button class="btn'+(canUp()?'':' sec')+'" data-a="open" data-s="up" style="width:100%;padding:12px">⬆️ Klassenentwicklung'+(canUp()?' – bereit!':'')+'</button>';}
    if(C.sk&&C.sk.length)h+='<h3>Fähigkeiten</h3>'+C.sk.map(x=>'<div class="rec"'+(S.lv<x.lv?' style="opacity:.5"':'')+'><div class="t">'+x.i+' '+x.n+' <small>'+(S.lv<x.lv?'ab Stufe '+x.lv:'freigeschaltet')+'</small></div><div class="c">'+x.d+'</div><small>Energie '+x.en+' · Abklingzeit '+x.cd+' s</small></div>').join('');
  }
  if(s==='set'){
    h+='<h3>Testmodus</h3><p style="font-size:14px">Im Testmodus ignoriert das Spiel dein GPS. Tippe auf die Karte, um dich dorthin zu bewegen, zum Beispiel drinnen oder am Schreibtisch.</p>'
      +'<button class="btn" data-a="test">Testmodus: '+(S.test?'AN (ausschalten)':'AUS (einschalten)')+'</button>'
      +'<button class="btn sec" style="margin-top:8px" data-a="opendev">🧪 Klasse wechseln (Vorschau)</button>'
      +'<button class="btn sec" style="margin-top:8px" data-a="cheatmat">🧪 Upgrade-Material ins Inventar</button>'
      +((S.test&&S.cls!=='wanderer'&&S.tier<3)?'<button class="btn sec" style="margin-top:8px" data-a="cheatup">🧪 Nächste Klassenentwicklung freischalten</button>':'')
      +'<h3>Spielstand</h3><p style="font-size:14px">Wird automatisch in diesem Browser gespeichert.</p>'
      +'<button class="btn sec" data-a="reset">'+(confirmReset?'Wirklich alles löschen? Nochmal tippen':'Spielstand löschen')+'</button>'
      +'<h3>Über</h3><p style="font-size:13px;line-height:1.5">Prototyp. Ressourcen und Monster entstehen deterministisch an festen Orten der echten Karte, für alle Spieler gleich. Respawn nach 8–15 Minuten. Kartendaten © OpenStreetMap-Mitwirkende.</p>';
  }
  $('#shB').innerHTML=h;
  $('#sheet').style.display='flex';
}
function closeSheet(){$('#sheet').style.display='none';curSheet=null;confirmReset=false;pickCls=null;pickPath=null;sellOk=0;}

/* ---------- UI ---------- */
let tt=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
let upNote=-1;
function hud(){
  updMe();
  const mx=maxHP();
  $('#lv').textContent=S.lv;
  $('#hpb').style.width=(100*S.hp/mx)+'%';$('#hpt').textContent=Math.floor(S.hp)+'/'+mx;
  $('#enb').style.width=S.en+'%';$('#en2').textContent=Math.floor(S.en)+'/100';
  $('#cu').textContent=fmtM(S.cu||0);
  const qb=$('#qb'),n=S.qready.length;qb.textContent=n;qb.style.display=n?'flex':'none';
  $('#cb').style.display=((S.cls==='wanderer'&&S.lv>=CLASS_LV)||canUp())?'flex':'none';
  if(canUp()&&upNote!==S.tier){upNote=S.tier;toast('🌟 Klassenentwicklung bereit! (Charakter)');}
}
function setTest(on){
  S.test=on;
  if(on){if(!P)setPos(START_POS[0],START_POS[1],5);else gpsChip();}
  else{if(lastGps)setPos(lastGps.lat,lastGps.lon,lastGps.acc);else{gpsChip();if(watchId==null)startGPS();}}
  save();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  switch(a){
    case 'start':startGPS();break;
    case 'starttest':$('#start').style.display='none';setTest(true);break;
    case 'close':deselect();break;
    case 'collect':collect();break;
    case 'shoot':shoot();break;
    case 'faintok':$('#faint').style.display='none';break;
    case 'skill':useSkill(parseInt(b.dataset.i,10));break;
    case 'open':if(curSheet===b.dataset.s)closeSheet();else openSheet(b.dataset.s);break;
    case 'shx':closeSheet();break;
    case 'craft':craft(b.dataset.id);break;
    case 'use':useItem(b.dataset.id);break;
    case 'test':setTest(!S.test);openSheet('set');break;
    case 'reset':
      if(!confirmReset){confirmReset=true;openSheet('set');}
      else{try{localStorage.removeItem(KEY);}catch(e){}location.reload();}
      break;
    case 'shop':if(sel&&sel.kind==='shop'){shopE=sel;stab='buy';openSheet('shop');}break;
    case 'stab':stab=b.dataset.t;sellOk=0;openSheet('shop');break;
    case 'sbuy':case 'sbuyg':case 'ssell':case 'ssellg':case 'srep':{
      if(!shopE||!P||dist(P,ep(shopE))>RANGE+15){toast('Du bist zu weit vom Händler weg');closeSheet();break;}
      const id=b.dataset.id,a=b.dataset.a;
      if(a==='sbuy'){const pr=BUY[id];if(pr&&(S.cu||0)>=pr){S.cu-=pr;add(id,1);toast('Gekauft: '+ITEMS[id].n);}}
      if(a==='sbuyg'){const pr=gBuyPrice(id);if((S.cu||0)>=pr){S.cu-=pr;const r2=addGear(id,0);toast('Gekauft: '+gNameT(r2.g)+(r2.auto?' (angelegt)':''));}}
      if(a==='ssell'){const n=b.dataset.n==='all'?have(id):1,q=Math.min(n,have(id));if(q>0&&SELL[id]){S.inv[id]-=q;earn(SELL[id]*q);toast('Verkauft: '+q+'× '+ITEMS[id].n+' für '+fmtM(SELL[id]*q));}}
      if(a==='ssellg'){const g=gearOf(+id);if(g&&!Object.values(S.eq).includes(g.u)){if(sellOk===g.u){earn(gSell(g));S.gear=S.gear.filter(x=>x.u!==g.u);sellOk=0;toast('Verkauft: '+gNameT(g)+' für '+fmtM(gSell(g)));}else{sellOk=g.u;openSheet('shop');break;}}}
      if(a==='srep'){const t=S.tools[+b.dataset.i];if(t){const m=(RECIPES.find(r=>r.id===t.id)||{dur:15}).dur,c=(m-t.dur)*REPAIR_PER;if(c>0&&(S.cu||0)>=c){S.cu-=c;t.dur=m;toast('Repariert: '+ITEMS[t.id].n);}}}
      save();hud();openSheet('shop');break;}
    case 'skipexh':{
      const rr=S.exh-Date.now();if(rr<=0)break;const cost=S.lv*20;
      if(skipArmed>Date.now()){
        if((S.cu||0)<cost){toast('Zu wenig Ruinmünzen ('+fmtM(cost)+')');break;}
        S.cu-=cost;S.exh=0;skipArmed=0;toast('✨ Erschöpfung beendet');save();hud();exhUI();renderCard();updateSkillUI();
      }else{skipArmed=Date.now()+4000;toast('Nochmal tippen: Erschöpfung beenden für '+fmtM(cost));}
      break;}
    case 'gearopen':gSlot=b.dataset.slot||'waffe';openSheet('gear');break;
    case 'gslot':gSlot=b.dataset.slot;openSheet('gear');break;
    case 'gequip':if(equip(+b.dataset.id)){save();hud();openSheet('gear');}break;
    case 'gunequip':delete S.eq[b.dataset.slot];save();hud();openSheet('gear');break;
    case 'gup':upgradeGear(+b.dataset.id);break;
    case 'rune':useRune=+b.dataset.q;openSheet('gear');break;
    case 'ctab':ctab=b.dataset.t;openSheet('craft');break;
    case 'cgear':craftGear(b.dataset.id);break;
    case 'uppath':pickPath=b.dataset.id;openSheet('up');break;
    case 'upok':{
      if(S.tier===2&&S.lv>=UP_LV[2]&&upQuestDone()&&!SECRET[S.path].ok()){toast('❓ Etwas fehlt noch… die Hinweise verraten mehr.');break;}
      if(!canUp())break;
      if(S.tier===0){if(!pickPath||PATHS[pickPath].b!==S.cls)break;S.path=pickPath;}
      S.tier++;S.qb=cnt();S.scd={};S.shield=0;S.stun=0;
      const st=PATHS[S.path].st[S.tier-1];
      closeSheet();buildSkillBar();S.hp=maxHP();
      const qw=addGear('q|'+S.path+'|'+S.tier,0);
      toast((S.tier===3?'🌟 Verborgene Klasse erweckt: ':'⬆️ Aufstieg: ')+st.i+' '+st.n+'! Neue Fähigkeit: '+st.sk.n+' · 🎁 '+gNameT(qw.g));
      save();hud();renderCard();updateNear();
      break;}
    case 'opendev':openSheet('dev');break;
    case 'devset':{
      S.cls=b.dataset.cls;S.path=b.dataset.path;S.tier=+b.dataset.tier;S.qb=cnt();S.scd={};S.shield=0;S.stun=0;
      pickPath='';buildSkillBar();S.hp=Math.min(S.hp,maxHP());save();hud();toast('Klasse: '+C0().n);openSheet('dev');break;}
    case 'cheatmat':{
      const M={eisenerz:2000,stein:500,kristall:30,steinherz:15,tyrannenzahn:5,moorperle:5,gebietsherz:5,drachenschuppe:10,rune0:10,rune1:10,rune2:10,rune3:10,rune4:10};
      for(const k in M)add(k,M[k]);
      S.cu=(S.cu||0)+100000;save();hud();toast('🧪 Material + Runen + 10 Gold erhalten');openSheet('set');break;}
    case 'cheatup':{
      const c=cnt();S.lv=Math.max(S.lv,UP_LV[Math.min(S.tier,2)]);
      S.qb={kills:c.kills-300,rare:c.rare-10,elite:c.elite-10,boss:c.boss-10,walk:c.walk-20000};
      if(S.tier===2&&S.path){const k=S.stats.kt;k.elite+=5;k.area+=1;k.rare+=15;k.boss+=3;S.stats.walk+=20000;S.stats.night+=10;S.stats.faints+=3;S.stats.nodes.baum=(S.stats.nodes.baum||0)+150;S.stats.nodes.erz=(S.stats.nodes.erz||0)+30;S.stats.nodes.kraut=(S.stats.nodes.kraut||0)+100;S.stats.crafted.trank=(S.stats.crafted.trank||0)+10;}
      S.hp=maxHP();save();hud();openSheet('set');break;}
    case 'clspick':pickCls=b.dataset.id;openSheet('class');break;
    case 'clsok':
      if(pickCls&&CLASSES[pickCls]&&S.lv>=CLASS_LV&&S.cls==='wanderer'){
        const c=CLASSES[pickCls];S.cls=pickCls;S.path='';S.tier=0;S.qb=cnt();S.scd={};S.shield=0;S.stun=0;closeSheet();buildSkillBar();
        fixGear();S.hp=maxHP();toast(c.i+' Du bist jetzt '+c.n+'! Neue Fähigkeit: '+c.sk[0].n);
        save();hud();renderCard();updateNear();
      }
      break;
    case 'qtab':qtab=b.dataset.t;openSheet('quests');break;
    case 'qclaim':claimQuest(b.dataset.id);break;
    case 'loc':follow=true;$('#loc').classList.remove('off');if(P)map.setView([P.lat,P.lon],Math.max(map.getZoom(),17));break;
  }
});

/* ---------- Takt ---------- */
let tc=0;
setInterval(()=>{
  const now=Date.now(),dt=(now-S.last)/1000;S.last=now;
  regen(dt);hud();tc++;
  roamTick(Math.min(3,dt>0?dt:1));
  if(P)updateNear();
  if(tc%10===0)refreshWorld();
  if(sel)renderCard();
  updateSkillUI();exhUI();
  if(tc%5===0)save();
},1000);
setInterval(()=>{if(sel&&sel.kind==='mob'&&Date.now()<nextAtk+300)renderCard();},250);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);

hud();buildSkillBar();
if(S.test){/* Testmodus war aktiv: Start-Dialog bleibt, damit man wählen kann */}
})();
</script>
</body>
</html>
