<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fdf6ee">
<title>Ruin Walk – GPS-RPG</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fdf6ee;--ink:#4a3526;--acc:#f6a623;--hp:#e5534b;--en:#3b82f6;--ok:#3aa76d;--card:#fffaf4;--line:#e8d9c6;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:#ddd;overflow:hidden;touch-action:manipulation}
#map{position:absolute;inset:0;background:#efe6d8}
.leaflet-tile-pane{filter:sepia(.3) saturate(.85) brightness(1.04)}
button{font-family:inherit;color:inherit}
/* HUD */
#hud{position:absolute;left:10px;top:calc(10px + var(--st));z-index:500;display:flex;gap:8px;align-items:center;background:rgba(255,250,244,.94);border:1px solid var(--line);border-radius:30px;padding:6px 12px 6px 6px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#lv{width:38px;height:38px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:#fff}
.bars{display:flex;flex-direction:column;gap:4px;width:130px}
.bar{position:relative;height:15px;border-radius:8px;background:#e9dccb;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%}
.bar.hp i{background:linear-gradient(#ff7a6e,#e5534b)}
.bar.en i{background:linear-gradient(#6aa8ff,#3b82f6)}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:15px;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#gps{position:absolute;right:10px;top:calc(10px + var(--st));z-index:500;background:rgba(255,250,244,.94);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#gps.good{color:#1f7a49}#gps.ok{color:#9a6a00}#gps.bad{color:#b3322b}
#toast{position:absolute;left:50%;top:calc(66px + var(--st));transform:translateX(-50%) translateY(-10px);z-index:900;background:rgba(60,40,28,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loc{position:absolute;right:12px;bottom:calc(76px + var(--sb));z-index:500;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#loc.off{background:var(--acc);color:#fff}
#attr{position:absolute;left:8px;bottom:calc(68px + var(--sb));z-index:400;font-size:10px;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px}
/* Nav */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:600;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
#nav button{position:relative;flex:1;border:0;background:none;font-size:11px;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
#nav button b{font-size:22px;font-weight:normal}
/* Card */
#card{position:absolute;left:10px;right:10px;bottom:calc(70px + var(--sb));z-index:700;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none;max-width:480px;margin:0 auto}
.ch{display:flex;gap:10px;align-items:center}
.ci{width:48px;height:48px;border-radius:12px;background:#f3e8d9;display:flex;align-items:center;justify-content:center;font-size:28px}
.ch small{display:block;opacity:.7;margin-top:2px}
.ch>div:nth-child(2){flex:1}
.x{border:0;background:none;font-size:20px;padding:4px 8px}
.row{margin:8px 0 4px;font-size:13px;line-height:1.5}
.bad{color:#b3322b}.good{color:#1f7a49}
.act{width:100%;margin-top:8px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;padding:12px;font-weight:bold}
.act:disabled{background:#e4dacb;color:#8a7766}
.hpbar{height:10px;border-radius:6px;background:#e9dccb;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--hp)}
/* Sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;top:12%;z-index:800;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.35);display:none;flex-direction:column}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;background:linear-gradient(#ffe0b0,var(--card));border-radius:22px 22px 0 0}
.sh-head h2{margin:0;font-size:22px}
#shB{flex:1;overflow:auto;padding:6px 16px calc(24px + var(--sb))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{background:#f6ecdd;border:1px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px;position:relative}
.it span{font-size:26px;display:block}.it b{position:absolute;right:6px;top:3px;font-size:13px}.it small{font-size:10px;display:block;line-height:1.1}
h3{margin:16px 0 6px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.rec{background:#f6ecdd;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.rec .t{font-weight:bold}.rec .c{font-size:13px;margin:4px 0}
.btn{border:0;border-radius:10px;background:var(--acc);color:#fff;padding:8px 14px;font-weight:bold;font-size:14px}
.btn:disabled{background:#e4dacb;color:#8a7766}
.btn.sec{background:#e9dccb;color:var(--ink)}
.q{background:#f6ecdd;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.q.done{opacity:.55}.q.act2{background:#ffe9c4;border-color:var(--acc)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.tabs{display:flex;gap:8px;margin:6px 0 12px}
.tab{flex:1;border:1px solid var(--line);background:#f6ecdd;border-radius:12px;padding:10px 4px;font-size:14px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold}
.badge{position:absolute;top:-2px;right:18%;min-width:18px;height:18px;padding:0 4px;background:#e5534b;color:#fff;border-radius:9px;font-size:11px;font-style:normal;font-weight:bold;display:none;align-items:center;justify-content:center}
.q .btn{width:100%;margin-top:8px;padding:11px;font-size:15px}
#skills{position:absolute;right:12px;bottom:calc(136px + var(--sb));z-index:500;display:none;flex-direction:column-reverse;gap:8px}
.sk{width:54px;height:54px;border-radius:50%;border:2px solid var(--acc);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.sk .si{font-size:22px}.sk .sc{font-size:10px;margin-top:3px;font-weight:bold}
.sk.off{opacity:.45;border-color:#b9a78f}
.skrow{display:flex;gap:12px;justify-content:center;margin-top:10px}
#exh{position:absolute;left:10px;top:calc(66px + var(--st));z-index:500;background:rgba(255,235,205,.96);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#faint{position:absolute;inset:0;z-index:1100;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:22px}
.fbox{background:var(--card);border-radius:20px;padding:20px;max-width:360px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.5);text-align:center}
.fbox h2{margin:0 0 6px;font-size:24px}.fbox p{margin:8px 0;font-size:14px;line-height:1.45}
.fbox ul{text-align:left;margin:8px 0 12px;padding-left:20px;font-size:14px;line-height:1.5}
/* Entities */
.leaflet-map-pane:not(.leaflet-zoom-anim) .leaflet-marker-icon.roam{transition:transform 1s linear}
.ent.t-rare{border-color:#9b5de5;background:#f1e6ff}
.ent.t-elite{border-color:#f5a623;border-width:3px;background:#fff0d2;box-shadow:0 0 10px 3px rgba(245,166,35,.65);font-size:26px}
.ent.t-boss{border-color:#c1121f;border-width:3px;background:#ffe0e0;box-shadow:0 0 14px 4px rgba(193,18,31,.55);font-size:32px}
.ent.t-area{border-color:#6a040f;border-width:4px;background:#ffd6d6;box-shadow:0 0 20px 7px rgba(106,4,15,.6);font-size:40px}
.ent.t-area::after{content:'👑';position:absolute;top:-18px;font-size:22px}
.ent{width:44px;height:44px;border-radius:50%;background:rgba(255,250,244,.96);border:2px solid #d9c3a5;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;transition:.15s}
.ent.near{border-color:var(--ok);box-shadow:0 0 0 4px rgba(58,167,109,.35),0 2px 6px rgba(0,0,0,.3)}
.ent.sel{transform:scale(1.18)}
.ent.mob{border-color:#e5534b;background:#fde8e5}
.ent.mob.near{box-shadow:0 0 0 4px rgba(229,83,75,.35)}
.mhp{position:absolute;left:4px;right:4px;bottom:-9px;height:5px;background:#5a2a27;border-radius:3px;overflow:hidden}
.mhp u{display:block;height:100%;background:#ff6b5e;width:100%}
.me{width:22px;height:22px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 2px #3b82f6,0 2px 8px rgba(0,0,0,.4)}
/* Start */
#start{position:absolute;inset:0;z-index:1000;background:linear-gradient(#ffe7c2,#fdf6ee);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:12px}
#start h1{margin:0;font-size:36px}
#start p{margin:0;max-width:340px;line-height:1.45}
#start .btn{font-size:17px;padding:14px 22px;width:100%;max-width:340px}
#start .warn{color:#b3322b;font-size:13px}
</style>
</head>
<body>
<div id="map"></div>

<div id="hud">
  <div id="lv">1</div>
  <div class="bars">
    <div class="bar hp"><i id="hpb"></i><span id="hpt"></span></div>
    <div class="bar en"><i id="enb"></i><span id="en2"></span></div>
  </div>
</div>
<div id="gps" class="bad">GPS: aus</div>
<div id="toast"></div>
<button id="loc" data-a="loc" aria-label="Zentrieren">◎</button>
<div id="attr">© OpenStreetMap-Mitwirkende</div>
<div id="exh"></div>
<div id="skills"></div>
<div id="card"></div>

<nav id="nav">
  <button data-a="open" data-s="inv"><b>🎒</b>Inventar</button>
  <button data-a="open" data-s="craft"><b>🔨</b>Herstellen</button>
  <button data-a="open" data-s="quests"><b>📜</b>Quests<i class="badge" id="qb"></i></button>
  <button data-a="open" data-s="char"><b>🧙</b>Charakter<i class="badge" id="cb">!</i></button>
  <button data-a="open" data-s="set"><b>⚙️</b>Mehr</button>
</nav>

<div id="sheet">
  <div class="sh-head"><h2 id="shT"></h2><button class="x" data-a="shx">✕</button></div>
  <div id="shB"></div>
</div>

<div id="faint"><div class="fbox" id="fbox"></div></div>

<div id="start">
  <h1>🏹 Ruin Walk</h1>
  <p>Erkunde deine echte Umgebung: sammle Ressourcen, stelle Werkzeug her und jage Monster. Geh dafür wirklich los, die Dinge liegen an echten Orten.</p>
  <button class="btn" data-a="start">📍 Standort aktivieren &amp; starten</button>
  <button class="btn sec" data-a="starttest">Erst ohne GPS testen (Augsburg)</button>
  <p class="warn" id="startWarn"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);

if(typeof L==='undefined'){
  $('#startWarn').textContent='Karte konnte nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.';
  $('#start [data-a=start]').disabled=true;$('#start [data-a=starttest]').disabled=true;
  return;
}
if(!window.isSecureContext){
  $('#startWarn').textContent='Hinweis: GPS funktioniert nur, wenn die Seite über https:// geöffnet wird.';
}

/* ---------- Konstanten ---------- */
const KEY='ruinwalk_v1';
const DLAT=0.0015, DLON=0.00226;   // Zellgröße ca. 165 m x 165 m
const RANGE=40, VIEW=2, SHOW_DIST=500, CLASS_LV=5;
const START_POS=[48.3705,10.8978]; // Augsburg Rathausplatz (Testmodus)

const ITEMS={
  stock:{n:'Stock',i:'🥢'}, stein:{n:'Kleiner Stein',i:'🪨'}, ranke:{n:'Ranke',i:'🌿'},
  holz:{n:'Holz',i:'🪵'}, eisenerz:{n:'Eisenerz',i:'🟤'}, kraut:{n:'Heilkraut',i:'☘️'},
  fell:{n:'Fell',i:'🧶'}, trank:{n:'Heiltrank',i:'🧪'},
  kaefer:{n:'Käferpanzer',i:'🪲'}, hauer:{n:'Eberhauer',i:'🦷'}, silberfell:{n:'Silberfell',i:'🧣'},
  kristall:{n:'Kristallsplitter',i:'💎'}, nachtfeder:{n:'Nachtfeder',i:'🪶'}, alphafell:{n:'Alphafell',i:'🧥'},
  steinherz:{n:'Steinherz',i:'💠'}, tyrannenzahn:{n:'Tyrannenzahn',i:'🦴'}, moorperle:{n:'Moorperle',i:'🧿'},
  drachenschuppe:{n:'Drachenschuppe',i:'🔶'}, gebietsherz:{n:'Gebietsherz',i:'💖'},
  kaeferhelm:{n:'Käferpanzer-Helm',i:'⛑️'}, keilerhandschuhe:{n:'Keiler-Handschuhe',i:'🧤'}, silberstiefel:{n:'Silberfell-Stiefel',i:'👢'},
  axt:{n:'Holzfälleraxt',i:'🪓'}, spitzhacke:{n:'Spitzhacke',i:'⛏️'}, fellweste:{n:'Fellweste',i:'🦺'}
};
const TOOLNAME={holz:'Holzfälleraxt',berg:'Spitzhacke'};
const NODES={
  stock:{n:'Ast',i:'🥢',w:22,drop:'stock',min:1,max:2,en:2,xp:1,res:8*60e3},
  stein:{n:'Kleiner Stein',i:'🪨',w:22,drop:'stein',min:1,max:2,en:2,xp:1,res:8*60e3},
  ranke:{n:'Ranke',i:'🌿',w:16,drop:'ranke',min:1,max:2,en:2,xp:1,res:8*60e3},
  kraut:{n:'Heilkraut',i:'☘️',w:14,drop:'kraut',min:1,max:2,en:2,xp:2,skill:'sammeln',res:10*60e3},
  baum:{n:'Baum',i:'🌲',w:14,drop:'holz',min:2,max:3,en:4,xp:3,skill:'holz',tool:'holz',res:12*60e3},
  erz:{n:'Eisenerzvorkommen',i:'⛰️',w:8,drop:'eisenerz',min:1,max:2,en:5,xp:4,skill:'berg',tool:'berg',res:15*60e3}
};
const MOBS={
  // normal (häufig)
  rohling:{n:'Rohling',i:'🐺',tier:'normal',hp:30,min:3,max:8,xp:8,rec:1,res:15*60e3,drops:[{i:'fell',min:1,max:2}]},
  kaefer:{n:'Riesenkäfer',i:'🪲',tier:'normal',hp:38,min:3,max:7,xp:10,rec:2,res:15*60e3,drops:[{i:'kaefer',min:1,max:2}]},
  keiler:{n:'Wildkeiler',i:'🐗',tier:'normal',hp:50,min:4,max:9,xp:12,rec:3,res:15*60e3,drops:[{i:'hauer',min:1,max:1},{i:'fell',min:1,max:1,c:.5}]},
  // selten
  silberfuchs:{n:'Silberfuchs',i:'🦊',tier:'rare',hp:80,min:5,max:11,xp:30,rec:5,res:30*60e3,drops:[{i:'silberfell',min:1,max:2},{i:'fell',min:1,max:2,c:.5}]},
  kristallhirsch:{n:'Kristallhirsch',i:'🦌',tier:'rare',hp:110,min:6,max:12,xp:40,rec:6,res:30*60e3,drops:[{i:'kristall',min:1,max:2}]},
  nachtkauz:{n:'Nachtkauz',i:'🦉',tier:'rare',hp:90,min:6,max:13,xp:35,rec:6,res:30*60e3,drops:[{i:'nachtfeder',min:1,max:3}]},
  // Elite
  alpharohling:{n:'Alpha-Rohling',i:'🐺',tier:'elite',hp:260,min:10,max:20,xp:90,rec:8,res:60*60e3,drops:[{i:'alphafell',min:1,max:2},{i:'fell',min:2,max:4},{i:'trank',min:1,max:1,c:.3}]},
  steinwaechter:{n:'Steinwächter',i:'🗿',tier:'elite',hp:320,min:12,max:22,xp:110,rec:10,res:60*60e3,drops:[{i:'steinherz',min:1,max:1},{i:'eisenerz',min:2,max:4}]},
  // Boss
  waldtyrann:{n:'Waldtyrann',i:'🐻',tier:'boss',hp:700,min:18,max:32,xp:300,rec:14,res:3*3600e3,drops:[{i:'tyrannenzahn',min:1,max:2},{i:'fell',min:5,max:8},{i:'trank',min:2,max:2}]},
  moorkoenigin:{n:'Moorkönigin',i:'🐊',tier:'boss',hp:800,min:20,max:34,xp:340,rec:16,res:3*3600e3,drops:[{i:'moorperle',min:1,max:1},{i:'kristall',min:2,max:3},{i:'trank',min:2,max:2}]},
  // Gebietsboss (einer pro Gebiet)
  aschedrache:{n:'Aschedrache',i:'🐉',tier:'area',hp:3000,min:30,max:55,xp:1500,rec:25,res:12*3600e3,drops:[{i:'gebietsherz',min:1,max:1},{i:'drachenschuppe',min:3,max:5},{i:'trank',min:4,max:4}]},
  bergtroll:{n:'Bergtroll',i:'🧌',tier:'area',hp:2600,min:28,max:50,xp:1300,rec:22,res:12*3600e3,drops:[{i:'gebietsherz',min:1,max:1},{i:'steinherz',min:3,max:3},{i:'trank',min:3,max:3}]},
  sumpfsaurier:{n:'Sumpfsaurier',i:'🦖',tier:'area',hp:2800,min:30,max:52,xp:1400,rec:24,res:12*3600e3,drops:[{i:'gebietsherz',min:1,max:1},{i:'moorperle',min:2,max:3},{i:'trank',min:3,max:3}]}
};
const TIERS={normal:{l:'Monster',sz:44},rare:{l:'💜 Seltenes Monster',sz:48},elite:{l:'⭐ Elite',sz:54},boss:{l:'👹 Boss',sz:62},area:{l:'👑 Gebietsboss',sz:74}};
const EXH_MS=180000;  // Erschöpfung nach Ohnmacht
function fmtT(ms){const t=Math.ceil(ms/1000);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
const SPEED={normal:1.0,rare:.7,elite:.4};   // m/s beim Wandern
const LEASH=60, CHASE_MULT=1.5, CHASE_STOP=10, DISENGAGE_M=150, DISENGAGE_MS=60000;
const SPAWN={normal:[['rohling',5],['kaefer',3],['keiler',2]],rare:[['silberfuchs',1],['kristallhirsch',1],['nachtkauz',1]],
  elite:[['alpharohling',1],['steinwaechter',1]],boss:[['waldtyrann',1],['moorkoenigin',1]],area:[['aschedrache',1],['bergtroll',1],['sumpfsaurier',1]]};
const REGION=12, AREA_DIST=4000; // Gebiet = 12x12 Zellen (ca. 2 x 3 km)
function fmtDist(d){return d>=1000?(d/1000).toFixed(1).replace('.',',')+' km':Math.round(d)+' m';}
const RECIPES=[
  {id:'axt',kind:'tool',type:'holz',dur:15,cost:{stock:3,stein:2,ranke:2}},
  {id:'spitzhacke',kind:'tool',type:'berg',dur:15,cost:{holz:2,stein:3,ranke:2}},
  {id:'trank',kind:'item',cost:{kraut:3}},
  {id:'fellweste',kind:'armor',slot:'brust',def:3,cost:{fell:4,ranke:2}},
  {id:'kaeferhelm',kind:'armor',slot:'kopf',def:2,cost:{kaefer:4,ranke:2}},
  {id:'keilerhandschuhe',kind:'armor',slot:'haende',def:2,cost:{hauer:3,fell:2}},
  {id:'silberstiefel',kind:'armor',slot:'fuesse',def:3,cost:{silberfell:2,fell:3}}
];
const SKILLNAME={holz:'Holzfällen',berg:'Bergbau',sammeln:'Sammeln'};
const SLOTS=[['waffe','Waffe'],['kopf','Kopf'],['brust','Brust'],['haende','Hände'],['fuesse','Füße']];
function equipped(slot){
  if(slot==='waffe'){const c=C0();return {i:c.wi,n:c.w};}
  const r=RECIPES.find(x=>x.kind==='armor'&&x.slot===slot&&S.stats.crafted[x.id]);
  return r?ITEMS[r.id]:null;
}

/* ---------- Klassen ---------- */
const CLASSES={

/* ---------- Geo ---------- */
function dist(a,b){
  const R=6371000,r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

/* ---------- Welt (deterministisch pro Zelle, für alle Spieler gleich) ---------- */
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return(h^(h>>>16))>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const WT=Object.values(NODES).reduce((s,n)=>s+n.w,0);
function pickType(r){let v=r()*WT;for(const k in NODES){v-=NODES[k].w;if(v<=0)return k;}return 'stock';}
function pickW(list,x){const t=list.reduce((a,b)=>a+b[1],0);let v=x*t;for(const [k,w] of list){v-=w;if(v<=0)return k;}return list[0][0];}
const cellCache=new Map();
function areaEnts(){
  if(!P)return [];
  const rx0=Math.floor(Math.floor(P.lon/DLON)/REGION),ry0=Math.floor(Math.floor(P.lat/DLAT)/REGION),out=[];
  for(let rx=rx0-1;rx<=rx0+1;rx++)for(let ry=ry0-1;ry<=ry0+1;ry++){
    const r=mulberry(hash(rx*7919+13,ry*104729+7)),
      cx=rx*REGION+Math.floor(r()*REGION),cy=ry*REGION+Math.floor(r()*REGION);
    out.push({id:'g'+rx+'_'+ry,kind:'mob',type:pickW(SPAWN.area,r()),lat:(cy+.1+r()*.8)*DLAT,lon:(cx+.1+r()*.8)*DLON});
  }
  return out;
}
function cellEnts(cx,cy){
  const key=cx+'_'+cy;
  if(cellCache.has(key))return cellCache.get(key);
  const r=mulberry(hash(cx,cy)),out=[],n=3+Math.floor(r()*3);
  for(let i=0;i<n;i++){
    const type=pickType(r);
    out.push({id:'n'+key+'_'+i,kind:'node',type,lat:(cy+.1+r()*.8)*DLAT,lon:(cx+.1+r()*.8)*DLON});
  }
  if(r()<.7)out.push({id:'m'+key,kind:'mob',type:'rohling',lat:(cy+.1+r()*.8)*DLAT,lon:(cx+.1+r()*.8)*DLON});
  const tn=r();const lastM=out[out.length-1];if(lastM&&lastM.kind==='mob')lastM.type=pickW(SPAWN.normal,tn);
  const rareChance=[['r',.12,'rare'],['e',.04,'elite'],['b',.01,'boss']];
  for(const [pre,ch,tier] of rareChance){
    if(r()<ch)out.push({id:pre+key,kind:'mob',type:pickW(SPAWN[tier],r()),lat:(cy+.1+r()*.8)*DLAT,lon:(cx+.1+r()*.8)*DLON});
  }
  if(cellCache.size>400)cellCache.clear();
  cellCache.set(key,out);
  return out;
}
function def2(e){return e.kind==='node'?NODES[e.type]:MOBS[e.type];}
function alive(e){const c=S.cd[e.id];return !c||Date.now()-c>=def2(e).res;}
function pruneCd(){const now=Date.now();for(const k in S.cd){if(now-S.cd[k]>13*3600e3){delete S.cd[k];delete S.mh[k];}}}

function canRoam(e){return e.kind==='mob'&&SPEED[MOBS[e.type].tier]!==undefined&&strHash(e.id)%10<6;}

function mk(e){

  const pe=ep(e);
  const m=L.marker([pe.lat,pe.lon],{icon:L.divIcon({className:canRoam(e)?'roam':'',html,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}),zIndexOffset:e.kind==='mob'?(tier==='area'?900:500):100}).addTo(map);
  m.on('click',ev=>{L.DomEvent.stopPropagation(ev);select(e.id);});
  return m;
}
function roamTick(dt){
  const now=Date.now(),cosf=lat=>Math.cos(lat*Math.PI/180);
  for(const [id,o] of ents){
    const r=roam.get(id);if(!r)continue;
    const e=o.e,tier=MOBS[e.type].tier,sp=SPEED[tier];
    let tlat,tlon,speed=sp,stopAt=0.8;
    const ea=eng.get(id);
    let chasing=false;
    if(ea!==undefined){
      if(P&&now-ea<DISENGAGE_MS&&dist(P,r)<DISENGAGE_M)chasing=true;
      else eng.delete(id);
    }
    if(chasing){tlat=P.lat;tlon=P.lon;speed=sp*CHASE_MULT;stopAt=CHASE_STOP;r.tlat=null;r.wait=rnd(2,6);}
    else{
      if(r.wait>0){r.wait-=dt;continue;}
      if(r.tlat===null){
        const away=dist(r,e)>LEASH;
        if(away){r.tlat=e.lat;r.tlon=e.lon;}
        else{
          const a=Math.random()*2*Math.PI,rad=Math.random()*LEASH;
          r.tlat=e.lat+Math.sin(a)*rad/111320;
          r.tlon=e.lon+Math.cos(a)*rad/(111320*cosf(e.lat));
        }
      }
      tlat=r.tlat;tlon=r.tlon;
    }
    const dy=(tlat-r.lat)*111320,dx=(tlon-r.lon)*111320*cosf(r.lat),d=Math.hypot(dx,dy);
    if(d<=stopAt){
      if(!chasing){r.tlat=null;r.wait=rnd(4,20);}
      continue;
    }
    const step=Math.min(speed*dt,d-(chasing?stopAt:0));
    r.lat+=dy/d*step/111320;
    r.lon+=dx/d*step/(111320*cosf(r.lat));
    o.m.setLatLng([r.lat,r.lon]);
  }
}
function refreshWorld(){
  if(!P)return;
  const cx=Math.floor(P.lon/DLON),cy=Math.floor(P.lat/DLAT),want=new Map();
  for(let dx=-VIEW;dx<=VIEW;dx++)for(let dy=-VIEW;dy<=VIEW;dy++)
    for(const e of cellEnts(cx+dx,cy+dy))if(alive(e)&&dist(P,e)<=SHOW_DIST)want.set(e.id,e);
  for(const e of areaEnts())if(alive(e)&&dist(P,e)<=AREA_DIST)want.set(e.id,e);
  for(const [id,o] of ents){if(!want.has(id)){map.removeLayer(o.m);ents.delete(id);roam.delete(id);eng.delete(id);if(sel&&sel.id===id)deselect();}}
  for(const [id,e] of want){if(!ents.has(id)){if(canRoam(e)&&!roam.has(id))roam.set(id,{lat:e.lat,lon:e.lon,tlat:null,tlon:null,wait:rnd(0,15)});ents.set(id,{e,m:mk(e)});}}
  for(const [id,o] of ents){
    if(o.e.kind==='mob'){
      const el=o.m.getElement();if(!el)continue;
      const u=el.querySelector('.mhp u'),mx=MOBS[o.e.type].hp;
      if(u)u.style.width=(100*(S.mh[id]??mx)/mx)+'%';
    }
  }
  updateNear();
}
function updateNear(){
  if(!P)return;
  for(const [id,o] of ents){
    const el=o.m.getElement();if(!el||!el.firstElementChild)continue;
    const n=el.firstElementChild,r=o.e.kind==='mob'?atkRange():RANGE;
    n.classList.toggle('near',dist(P,ep(o.e))<=r);
    n.classList.toggle('sel',!!sel&&sel.id===id);

}

function renderCard(){

        +'<br>Empfohlen: Stufe '+d.rec+(S.lv+2<d.rec?' <span class="bad">⚠️ sehr gefährlich</span>':'')
        +'<br>Beute: '+d.drops.map(x=>ITEMS[x.i].i+(x.c?'?':'')).join(' ')+'</div>'+skRow();

      else dis=false;
    }else{
      action='collect';label='Einsammeln';

      body='<div class="row">'+(tl?tl+'<br>':'')+'Energie: '+d.en+' · Ertrag: '+ITEMS[d.drop].i+' '+d.min+'–'+d.max+'</div>';

    +body+'<button id="cAct" class="act" data-a="'+(action||'close')+'" '+(dis?'disabled':'')+btnTail;
  const key=html.replace(subH,'').replace(btnTail,'></button>');
  if(c._k!==key){c.innerHTML=html;c._k=key;}
  else{const a=$('#cSub'),b=$('#cAct');if(a)a.textContent=sub;if(b)b.textContent=label;}
  c.style.display='block';updateSkillUI();
}

/* ---------- Aktionen ---------- */
function collect(){
  const e=sel;if(!e||e.kind!=='node'||!P)return;
  const t=NODES[e.type];
  if(dist(P,ep(e))>RANGE){toast('Zu weit weg');return;}
  let tool=null;
  if(t.tool){tool=findTool(t.tool);if(!tool){toast('Dir fehlt das Werkzeug');return;}}
  if(S.en<t.en){toast('Zu erschöpft');return;}
  S.en-=t.en;
  let broke='';
  if(tool){tool.dur--;if(tool.dur<=0){S.tools=S.tools.filter(x=>x!==tool);broke=' · '+ITEMS[tool.id].n+' zerbrochen!';}}
  let q=rnd(t.min,t.max);
  if(t.skill&&Math.random()<Math.min(.5,(sl(t.skill)-1)*.1))q++;
  add(t.drop,q);
  S.stats.col[t.drop]=(S.stats.col[t.drop]||0)+q;
  S.stats.nodes[e.type]=(S.stats.nodes[e.type]||0)+1;
  if(t.skill)S.skills[t.skill]+=t.xp;
  S.cd[e.id]=Date.now();
  addXP(t.xp);
  toast('+'+q+' '+ITEMS[t.drop].n+broke);
  deselect();refreshWorld();checkQuests();save();hud();
}
function strike(o){
  const e=sel;if(!e||e.kind!=='mob'||!P)return false;
  const m=MOBS[e.type],C=C0();
  if(Date.now()<S.exh){toast('😵 Du bist noch erschöpft ('+fmtT(S.exh-Date.now())+')');return false;}
  if(dist(P,ep(e))>(C.range+(o.rangeBonus||0))){toast('Zu weit weg');return false;}
  eng.set(e.id,Date.now());
  if(S.en<o.en){toast('Zu erschöpft');return false;}
  S.en-=o.en;
  let dmg=0,crit=false;
  for(let i=0;i<(o.hits||1);i++){
    let d=Math.max(1,Math.round((atk()+rnd(0,8))*o.mult));
    if(o.crit||Math.random()<C.crit){d*=2;crit=true;}
    dmg+=d;
  }
  let heal='';
  if(o.heal){const b0=S.hp;S.hp=Math.min(maxHP(),S.hp+o.heal);if(S.hp>b0)heal=' · +'+Math.round(S.hp-b0)+' ❤️';}
  if(o.shield)S.shield=o.shield;
  if(o.stun)S.stun=o.stun;
  const hp=(S.mh[e.id]??m.hp)-dmg;
  if(hp<=0){
    delete S.mh[e.id];S.cd[e.id]=Date.now();S.stats.kills++;S.stun=0;
    const got=[];
    for(const dr of m.drops){if(Math.random()<(dr.c??1)){const q=rnd(dr.min,dr.max);add(dr.i,q);S.stats.col[dr.i]=(S.stats.col[dr.i]||0)+q;got.push('+'+q+' '+ITEMS[dr.i].n);}}
    addXP(m.xp);
    toast('💥 '+m.n+' besiegt! '+got.join(', '));
    deselect();refreshWorld();checkQuests();
  }else{
    S.mh[e.id]=hp;
    let msg=(crit?'💥 Kritisch! ':(o.icon||C.i)+' ')+dmg+' Schaden'+heal;
    if(S.stun>0){S.stun--;msg+=' · '+m.n+' ist gelähmt';}
    else if(Math.random()<.6){
      let h=Math.max(1,rnd(m.min,m.max)-defense());
      if(S.shield>0){S.shield--;h=Math.max(1,Math.round(h*.3));}
      S.hp-=h;msg+=' · '+m.n+' trifft dich: -'+h;
    }
    if(S.hp<=0)faint(m,e);
    else toast(msg);
    refreshWorld();
  }
  save();hud();renderCard();
  return true;
}
function faint(m,e){
  S.hp=Math.round(maxHP()*.3);S.mh[e.id]=m.hp;S.shield=0;S.stun=0;eng.delete(e.id);
  const lines=[];
  if(S.cls==='wanderer'&&S.lv<CLASS_LV){
    lines.push('Anfängerschutz: Als Wanderer bleibst du ohne Strafe.');
  }else{
    const hard=m.tier==='elite'||m.tier==='boss'||m.tier==='area';
    const need=S.lv*40,lost=Math.min(S.xp,Math.round(need*(hard?.10:.05)));
    S.xp-=lost;lines.push('−'+lost+' Erfahrung');
    if(hard){
      let n=0;for(const t of S.tools){const nd=Math.max(1,Math.floor(t.dur*.8));if(nd<t.dur){t.dur=nd;n++;}}
      if(n)lines.push('Werkzeug −20 % Haltbarkeit');
    }
    S.exh=Date.now()+EXH_MS;lines.push('Erschöpft für '+fmtT(EXH_MS)+' (kein Kampf, Laufen und Sammeln gehen)');
  }
  deselect();
  $('#fbox').innerHTML='<h2>💫 Ohnmächtig!</h2><p>'+m.n+' hat dich besiegt. Das Spiel hat dich an dieser Stelle wiederbelebt. Du hast '+S.hp+' Leben.</p><ul>'+lines.map(x=>'<li>'+x+'</li>').join('')+'</ul><button class="btn" style="width:100%;padding:13px;font-size:16px" data-a="faintok">Weiter</button>';
  $('#faint').style.display='flex';
}
function exhUI(){
  const r=S.exh-Date.now(),el=$('#exh');
  if(r>0){el.textContent='😵 Erschöpft '+fmtT(r);el.style.display='block';}else el.style.display='none';
}
function shoot(){
  const C=C0();
  strike({mult:C.dmg,hits:C.hits,en:C.en,heal:C.heal});
}
function useSkill(i){
  const C=C0(),sk=(C.sk||[])[i];if(!sk)return;
  if(S.lv<sk.lv){toast('Diese Fähigkeit gibt es ab Stufe '+sk.lv);return;}
  const now=Date.now(),rd=S.scd[sk.id]||0;
  if(now<rd){toast('Noch '+Math.ceil((rd-now)/1000)+' s Abklingzeit');return;}
  if(S.en<sk.en){toast('Zu erschöpft');return;}
  if(sk.mult){
    if(!strike({mult:sk.mult,hits:sk.hits,crit:sk.crit,en:sk.en,rangeBonus:sk.rangeBonus,heal:sk.heal,stun:sk.stun,shield:sk.shield,icon:sk.i}))return;
  }else{
    S.en-=sk.en;
    if(sk.heal){const b0=S.hp;S.hp=Math.min(maxHP(),S.hp+sk.heal+(sk.perLv||0)*S.lv);toast(sk.i+' '+sk.n+': +'+Math.round(S.hp-b0)+' Leben');}
    if(sk.healPct){const b0=S.hp;S.hp=Math.min(maxHP(),S.hp+maxHP()*sk.healPct);toast(sk.i+' '+sk.n+': +'+Math.round(S.hp-b0)+' Leben');}
    if(sk.shield){S.shield=sk.shield;toast(sk.i+' '+sk.n+': Schutz für '+sk.shield+' Treffer');}
  }
  S.scd[sk.id]=now+sk.cd*1000;
  save();hud();updateSkillUI();
}
function skBtn(i){return '<button class="sk" data-a="skill" data-i="'+i+'" data-sk="'+i+'"><span class="si">'+C0().sk[i].i+'</span><small class="sc"></small></button>';}
function skRow(){const C=C0();return (C.sk&&C.sk.length)?'<div class="skrow">'+C.sk.map((x,i)=>skBtn(i)).join('')+'</div>':'';}
function buildSkillBar(){const C=C0();$('#skills').innerHTML=(C.sk||[]).map((x,i)=>skBtn(i)).join('');updateSkillUI();}
function updateSkillUI(){
  const C=C0(),sk=C.sk||[],now=Date.now();
  const cardShown=$('#card').style.display==='block';
  $('#skills').style.display=(sk.length&&!cardShown)?'flex':'none';
  const list=document.querySelectorAll?document.querySelectorAll('[data-sk]'):[];
  for(const el of list){
    const x=sk[+el.dataset.sk];if(!x)continue;
    const cd=Math.ceil(((S.scd[x.id]||0)-now)/1000);
    let txt,off=false;
    if(S.lv<x.lv){txt='Lv'+x.lv;off=true;}
    else if(cd>0){txt=cd+' s';off=true;}
    else if(x.mult&&S.exh>now){txt='😵';off=true;}
    else{txt=x.en+'⚡';off=S.en<x.en;}
    const sc=el.querySelector('.sc');if(sc)sc.textContent=txt;
    el.classList.toggle('off',off);
  }
}
function craft(id){
  const r=RECIPES.find(x=>x.id===id);if(!r)return;
  if(r.kind==='armor'&&S.stats.crafted[id]){toast('Schon hergestellt');return;}
  for(const k in r.cost)if(have(k)<r.cost[k]){toast('Material fehlt');return;}
  for(const k in r.cost)S.inv[k]-=r.cost[k];
  if(r.kind==='tool')S.tools.push({id:r.id,type:r.type,dur:r.dur});
  else if(r.kind==='item')add(r.id,1);
  else if(r.kind==='armor')S.def+=r.def;
  S.stats.crafted[id]=(S.stats.crafted[id]||0)+1;
  toast('🔨 '+ITEMS[id].n+' hergestellt');
  checkQuests();save();openSheet('craft');
}
function useItem(id){
  if(id==='trank'&&have('trank')>0){
    if(S.hp>=maxHP()){toast('Leben ist schon voll');return;}
    S.inv.trank--;S.hp=Math.min(maxHP(),S.hp+40);toast('🧪 +40 Leben');hud();save();openSheet('inv');
  }
}

/* ---------- Quests ---------- */
const QUESTS=[
  {id:'q1',t:'Erste Schritte',d:'Sammle Material und stelle eine Holzfälleraxt her.',rt:'10 XP',
   goals:()=>[['Stöcke sammeln',S.stats.col.stock||0,3],['Kleine Steine sammeln',S.stats.col.stein||0,2],['Ranken sammeln',S.stats.col.ranke||0,2],['Holzfälleraxt herstellen',S.stats.crafted.axt||0,1]],
   reward:()=>addXP(10)},
  {id:'q2',t:'Holzfäller',d:'Fälle ein paar Bäume im Umkreis.',rt:'2 Heiltränke',
   goals:()=>[['Bäume fällen',S.stats.nodes.baum||0,3]],reward:()=>add('trank',2)},
  {id:'q3',t:'Jäger',d:'Besiege Rohlinge mit deinem Bogen.',rt:'20 XP',
   goals:()=>[['Rohlinge besiegen',S.stats.kills||0,2]],reward:()=>addXP(20)},
  {id:'q4',t:'Bergmann',d:'Stelle eine Spitzhacke her und baue Eisenerz ab.',rt:'30 XP',
   goals:()=>[['Spitzhacke herstellen',S.stats.crafted.spitzhacke||0,1],['Eisenerz abbauen',S.stats.nodes.erz||0,2]],reward:()=>addXP(30)}
];
function checkQuests(){
  for(const q of QUESTS){
    if(S.qdone.includes(q.id)||S.qready.includes(q.id))continue;
    if(q.goals().every(g=>g[1]>=g[2])){
      S.qready.push(q.id);
      toast('📜 Quest geschafft: '+q.t+' – Belohnung im Quest-Fenster abholen!');
    }else break; // spätere Quests bleiben gesperrt
  }
}
function claimQuest(id){
  const q=QUESTS.find(x=>x.id===id);
  if(!q||!S.qready.includes(id))return;
  S.qready=S.qready.filter(x=>x!==id);
  S.qdone.push(id);
  q.reward();
  toast('🎁 Belohnung erhalten: '+q.rt);
  checkQuests();save();hud();openSheet('quests');
}

/* ---------- Menüs ---------- */
let curSheet=null,confirmReset=false,qtab='cur',pickCls=null;
function openSheet(s){
  curSheet=s;
  const titles={inv:'Inventar',craft:'Herstellen',quests:'Quests',char:'Charakter',set:'Mehr',class:'Klasse wählen'};
  $('#shT').textContent=titles[s];
  let h='';
  if(s==='inv'){
    const it=Object.entries(S.inv).filter(([k,n])=>n>0&&ITEMS[k]);
    h+=it.length?'<div class="grid">'+it.map(([k,n])=>'<div class="it"><span>'+ITEMS[k].i+'</span><b>'+n+'</b><small>'+ITEMS[k].n+'</small></div>').join('')+'</div>':'<p>Noch leer. Geh los und sammle etwas!</p>';
    h+='<h3>Werkzeug</h3>';
    h+=S.tools.length?S.tools.map(t=>'<div class="kv"><span>'+ITEMS[t.id].i+' '+ITEMS[t.id].n+'</span><span>Haltbarkeit '+t.dur+'</span></div>').join(''):'<p>Kein Werkzeug. Stelle unter „Herstellen“ eins her.</p>';
    if(have('trank')>0)h+='<h3>Benutzen</h3><button class="btn" data-a="use" data-id="trank">🧪 Heiltrank trinken ('+have('trank')+')</button>';
  }
  if(s==='craft'){
    h+=RECIPES.map(r=>{
      const ok=Object.keys(r.cost).every(k=>have(k)>=r.cost[k]),done=r.kind==='armor'&&S.stats.crafted[r.id];
      const cost=Object.keys(r.cost).map(k=>'<span class="'+(have(k)>=r.cost[k]?'good':'bad')+'">'+ITEMS[k].i+' '+have(k)+'/'+r.cost[k]+'</span>').join(' · ');
      const info=r.kind==='tool'?'Haltbarkeit '+r.dur:r.kind==='armor'?'+'+r.def+' Verteidigung':'Heilt 40 Leben';
      return '<div class="rec"><div class="t">'+ITEMS[r.id].i+' '+ITEMS[r.id].n+'</div><div class="c">'+cost+'</div><small>'+info+'</small><br><button class="btn" style="margin-top:6px" data-a="craft" data-id="'+r.id+'" '+((!ok||done)?'disabled':'')+'>'+(done?'Schon vorhanden':'Herstellen')+'</button></div>';
    }).join('');
  }
  if(s==='quests'){
    const readyL=QUESTS.filter(q=>S.qready.includes(q.id));
    const doneL=QUESTS.filter(q=>S.qdone.includes(q.id));
    const curL=QUESTS.filter(q=>!S.qdone.includes(q.id)&&!S.qready.includes(q.id));
    const goalLines=q=>q.goals().map(g=>'<div>'+(g[1]>=g[2]?'✅':'⬜')+' '+g[0]+' '+Math.min(g[1],g[2])+'/'+g[2]+'</div>').join('');
    h+='<div class="tabs"><button class="tab'+(qtab==='cur'?' on':'')+'" data-a="qtab" data-t="cur">Aktuelle ('+(readyL.length+curL.length)+')</button>'
      +'<button class="tab'+(qtab==='done'?' on':'')+'" data-a="qtab" data-t="done">Erledigte ('+doneL.length+')</button></div>';
    if(qtab==='cur'){
      h+=readyL.map(q=>'<div class="q act2"><b>🎉 '+q.t+'</b><div style="font-size:13px;margin:3px 0">'+q.d+'</div>'+goalLines(q)
        +'<button class="btn" data-a="qclaim" data-id="'+q.id+'">🎁 Belohnung abholen: '+q.rt+'</button></div>').join('');
      h+=curL.map((q,i)=>i===0
        ?'<div class="q act2"><b>'+q.t+'</b><div style="font-size:13px;margin:3px 0">'+q.d+'</div>'+goalLines(q)+'<small>Belohnung: '+q.rt+'</small></div>'
        :'<div class="q"><b>'+q.t+'</b><div>🔒 Noch gesperrt</div></div>').join('');
      if(!readyL.length&&!curL.length)h+='<p>Keine offenen Quests. Neue folgen bald!</p>';
    }else{
      h+=doneL.length?doneL.map(q=>'<div class="q done"><b>✓ '+q.t+'</b><div style="font-size:13px;margin:3px 0">'+q.d+'</div><small>Belohnung abgeholt: '+q.rt+'</small></div>').join('')
        :'<p>Noch keine erledigten Quests.</p>';
    }
  }
  if(s==='class'){
    if(S.cls!=='wanderer'||S.lv<CLASS_LV){h+='<p>Du kannst noch keine Klasse wählen.</p>';}
    else{
      h+='<p style="font-size:14px;margin-top:0">Wähle deine Grundklasse. Die Entscheidung ist vorerst dauerhaft. Upgrades und Klassenwechsel kommen später.</p>';
      h+=PICK.map(id=>{
        const c=CLASSES[id],on=pickCls===id;
        return '<div class="rec"'+(on?' style="border-color:var(--acc);background:#ffe9c4"':'')+'><div class="t">'+c.i+' '+c.n+'</div><div class="c">'+c.blurb+'</div><small>'+c.w+' · Reichweite '+c.range+' m · Energie '+c.en+' pro Angriff</small><br>'
          +(on?'<button class="btn" style="margin-top:8px;width:100%;padding:11px" data-a="clsok">✔ Als '+c.n+' entscheiden</button>'
              :'<button class="btn sec" style="margin-top:8px" data-a="clspick" data-id="'+id+'">Auswählen</button>')+'</div>';
      }).join('');
    }
  }
  if(s==='char'){
    const need=S.lv*40;
    h+='<div class="kv"><span>Level</span><b>'+S.lv+'</b></div>'
      +'<div class="kv"><span>Erfahrung</span><b>'+Math.floor(S.xp)+' / '+need+'</b></div>'
      +'<div class="kv"><span>Leben</span><b>'+Math.floor(S.hp)+' / '+maxHP()+'</b></div>'
      +'<div class="kv"><span>Angriff</span><b>'+atk()+'</b></div>'
      +'<div class="kv"><span>Verteidigung</span><b>'+S.def+' <small>(durch Ausrüstung)</small></b></div>'
      +'<div class="kv"><span>Besiegte Monster</span><b>'+S.stats.kills+'</b></div>'
      +'<h3>Ausrüstung</h3><div class="grid" style="grid-template-columns:repeat(5,1fr)">'
      +SLOTS.map(([k,l])=>{const e=equipped(k);return '<div class="it"'+(e?'':' style="opacity:.5"')+'><span>'+(e?e.i:'➕')+'</span><small>'+l+'</small><small>'+(e?e.n:'leer')+'</small></div>';}).join('')+'</div>'
      +'<h3>Lebensfertigkeiten</h3>'
      +Object.keys(SKILLNAME).map(k=>'<div class="kv"><span>'+SKILLNAME[k]+'</span><b>Stufe '+sl(k)+' <small>('+(S.skills[k]%10)+'/10)</small></b></div>').join('')
      +'';
    const C=C0();
    h+='<h3>Klasse</h3><div class="kv"><span>'+C.i+' '+C.n+'</span><small>'+C.w+' · '+C.range+' m</small></div>';
    if(S.cls==='wanderer'){
      h+=S.lv>=CLASS_LV
        ?'<button class="btn" data-a="open" data-s="class" style="margin-top:10px;width:100%;padding:13px;font-size:16px">🌟 Klasse wählen</button>'
        :'<p style="font-size:13px">Ab Stufe '+CLASS_LV+' kannst du eine Klasse wählen (noch '+(CLASS_LV-S.lv)+' Stufen).</p>';
    }else h+='<p style="font-size:13px">'+C.blurb+'</p>';
    if(C.sk&&C.sk.length)h+='<h3>Fähigkeiten</h3>'+C.sk.map(x=>'<div class="rec"'+(S.lv<x.lv?' style="opacity:.5"':'')+'><div class="t">'+x.i+' '+x.n+' <small>'+(S.lv<x.lv?'ab Stufe '+x.lv:'freigeschaltet')+'</small></div><div class="c">'+x.d+'</div><small>Energie '+x.en+' · Abklingzeit '+x.cd+' s</small></div>').join('');
  }
  if(s==='set'){
    h+='<h3>Testmodus</h3><p style="font-size:14px">Im Testmodus ignoriert das Spiel dein GPS. Tippe auf die Karte, um dich dorthin zu bewegen, zum Beispiel drinnen oder am Schreibtisch.</p>'
      +'<button class="btn" data-a="test">Testmodus: '+(S.test?'AN (ausschalten)':'AUS (einschalten)')+'</button>'
      +'<h3>Spielstand</h3><p style="font-size:14px">Wird automatisch in diesem Browser gespeichert.</p>'
      +'<button class="btn sec" data-a="reset">'+(confirmReset?'Wirklich alles löschen? Nochmal tippen':'Spielstand löschen')+'</button>'
      +'<h3>Über</h3><p style="font-size:13px;line-height:1.5">Prototyp. Ressourcen und Monster entstehen deterministisch an festen Orten der echten Karte, für alle Spieler gleich. Respawn nach 8–15 Minuten. Kartendaten © OpenStreetMap-Mitwirkende.</p>';
  }
  $('#shB').innerHTML=h;
  $('#sheet').style.display='flex';
}
function closeSheet(){$('#sheet').style.display='none';curSheet=null;confirmReset=false;pickCls=null;}

/* ---------- UI ---------- */
let tt=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
function hud(){
  const mx=maxHP();
  $('#lv').textContent=S.lv;
  $('#hpb').style.width=(100*S.hp/mx)+'%';$('#hpt').textContent=Math.floor(S.hp)+'/'+mx;
  $('#enb').style.width=S.en+'%';$('#en2').textContent=Math.floor(S.en)+'/100';
  const qb=$('#qb'),n=S.qready.length;qb.textContent=n;qb.style.display=n?'flex':'none';
  $('#cb').style.display=(S.cls==='wanderer'&&S.lv>=CLASS_LV)?'flex':'none';
}
function setTest(on){
  S.test=on;
  if(on){if(!P)setPos(START_POS[0],START_POS[1],5);else gpsChip();}
  else{if(lastGps)setPos(lastGps.lat,lastGps.lon,lastGps.acc);else{gpsChip();if(watchId==null)startGPS();}}
  save();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  switch(a){
    case 'start':startGPS();break;
    case 'starttest':$('#start').style.display='none';setTest(true);break;
    case 'close':deselect();break;
    case 'collect':collect();break;
    case 'shoot':shoot();break;
    case 'faintok':$('#faint').style.display='none';break;
    case 'skill':useSkill(parseInt(b.dataset.i,10));break;
    case 'open':if(curSheet===b.dataset.s)closeSheet();else openSheet(b.dataset.s);break;
    case 'shx':closeSheet();break;
    case 'craft':craft(b.dataset.id);break;
    case 'use':useItem(b.dataset.id);break;
    case 'test':setTest(!S.test);openSheet('set');break;
    case 'reset':
      if(!confirmReset){confirmReset=true;openSheet('set');}
      else{try{localStorage.removeItem(KEY);}catch(e){}location.reload();}
      break;
    case 'clspick':pickCls=b.dataset.id;openSheet('class');break;
    case 'clsok':
      if(pickCls&&CLASSES[pickCls]&&S.lv>=CLASS_LV&&S.cls==='wanderer'){
        const c=CLASSES[pickCls];S.cls=pickCls;S.scd={};S.shield=0;S.stun=0;closeSheet();buildSkillBar();
        S.hp=maxHP();toast(c.i+' Du bist jetzt '+c.n+'! Neue Fähigkeit: '+c.sk[0].n);
        save();hud();renderCard();updateNear();
      }
      break;
    case 'qtab':qtab=b.dataset.t;openSheet('quests');break;
    case 'qclaim':claimQuest(b.dataset.id);break;
    case 'loc':follow=true;$('#loc').classList.remove('off');if(P)map.setView([P.lat,P.lon],Math.max(map.getZoom(),17));break;
  }
});

/* ---------- Takt ---------- */
let tc=0;
setInterval(()=>{
  const now=Date.now(),dt=(now-S.last)/1000;S.last=now;
  regen(dt);hud();tc++;
  roamTick(Math.min(3,dt>0?dt:1));
  if(P)updateNear();
  if(tc%10===0)refreshWorld();
  if(sel)renderCard();
  updateSkillUI();exhUI();
  if(tc%5===0)save();
},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);

hud();buildSkillBar();
if(S.test){/* Testmodus war aktiv: Start-Dialog bleibt, damit man wählen kann */}
})();
</script>
</body>
</html>
